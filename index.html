<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Таро — 3D Расклад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #090204;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #ebd3b8;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #090204;
    }

    /* Фон: Фон.png с мягким резервным градиентом */
    #bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: #0b0205;
      background-image:
        radial-gradient(ellipse at 50% 25%, rgba(92, 16, 28, 0.35) 0%, rgba(9, 2, 4, 0.92) 72%),
        url('Фон.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Тонкий слой мерцания свечей поверх фона */
    #candle-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 4% 55%, rgba(255, 168, 86, 0.14) 0%, transparent 32%),
        radial-gradient(circle at 96% 62%, rgba(255, 154, 72, 0.13) 0%, transparent 28%);
      animation: candlePulse 3.4s ease-in-out infinite alternate;
    }

    @keyframes candlePulse {
      0%   { opacity: 0.72; }
      35%  { opacity: 0.96; }
      65%  { opacity: 0.80; }
      100% { opacity: 1.00; }
    }

    /* 3D сцена Three.js */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    /* UI-оверлей */
    #ui-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }

    .top-status {
      text-align: center;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(196, 132, 82, 0.35);
    }

    .top-status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .top-status .title {
      font-size: 18px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e9c9a2;
      font-weight: 600;
    }

    .top-status .subtitle {
      font-size: 14px;
      font-style: italic;
      color: rgba(235, 205, 174, 0.78);
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    /* Панель выпавших карт */
    #cards-banner {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.55s ease, transform 0.55s ease;
      margin-bottom: 10px;
    }

    #cards-banner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-label {
      flex: 1;
      background: linear-gradient(180deg, rgba(24, 5, 10, 0.84) 0%, rgba(12, 2, 5, 0.92) 100%);
      border: 1px solid rgba(206, 158, 114, 0.38);
      border-radius: 10px;
      padding: 7px 5px;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
    }

    .card-label .pos {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(212, 165, 120, 0.72);
      margin-bottom: 2px;
    }

    .card-label .name {
      font-size: 12.5px;
      line-height: 1.18;
      color: #f3dcc0;
      font-weight: 600;
    }

    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #hint-pill {
      padding: 9px 20px;
      border-radius: 999px;
      background: rgba(18, 4, 8, 0.72);
      border: 1px solid rgba(212, 165, 120, 0.35);
      color: #efd7b8;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      animation: hintFloat 2.8s ease-in-out infinite;
    }

    #hint-pill.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    @keyframes hintFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    #reset-btn {
      pointer-events: auto;
      cursor: pointer;
      padding: 11px 28px;
      border-radius: 999px;
      border: 1px solid rgba(224, 178, 126, 0.55);
      background: linear-gradient(180deg, rgba(78, 12, 24, 0.88) 0%, rgba(36, 5, 11, 0.94) 100%);
      color: #f5dfc4;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 220, 180, 0.22);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease, filter 0.2s ease;
    }

    #reset-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #reset-btn:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="bg-layer"></div>
    <div id="candle-glow"></div>
    <canvas id="webgl-canvas"></canvas>

    <div id="ui-layer">
      <div id="top-status" class="top-status">
        <div class="title" id="status-title">Расклад Таро</div>
        <div class="subtitle" id="status-subtitle">Сосредоточьтесь на своём вопросе</div>
      </div>

      <div class="bottom-controls">
        <div id="cards-banner"></div>
        <div id="hint-pill">Коснитесь колоды, чтобы перетасовать</div>
        <button id="reset-btn" type="button">Новый расклад</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // =====================================================================
      // 1. TELEGRAM MINI APP INITIALIZATION (FULLSCREEN)
      // =====================================================================
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.requestFullscreen === 'function') {
            tg.requestFullscreen();
          }
          if (typeof tg.disableVerticalSwipes === 'function') {
            tg.disableVerticalSwipes();
          }
          if (typeof tg.setHeaderColor === 'function') {
            tg.setHeaderColor('#090204');
          }
          if (typeof tg.setBackgroundColor === 'function') {
            tg.setBackgroundColor('#090204');
          }
        } catch (e) {
          console.warn('Telegram WebApp init warning:', e);
        }
      }

      function haptic(type = 'light') {
        try {
          if (tg && tg.HapticFeedback) {
            if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
            else tg.HapticFeedback.impactOccurred(type);
          }
        } catch (_) {}
      }

      // =====================================================================
      // 2. ПОЛНЫЙ СПИСОК 78 КАРТ ТАРО (ИМЕНА ФАЙЛОВ БЕЗ .png)
      // =====================================================================
      const TAROT_CARDS = [
        // Старшие арканы (22)
        '0-22 аркан - Дурак',
        '1 аркан - Маг',
        '2 аркан - Жрица',
        '3 аркан - Императрица',
        '4 аркан - Император',
        '5 аркан - Жрец',
        '6 аркан - Влюбленные',
        '7 аркан - Колесница',
        '8 аркан - Сила',
        '9 аркан - Отшельник',
        '10 аркан - Колесо фортуны',
        '11 аркан - Справедливость',
        '12 аркан - Повешенный',
        '13 аркан - Смерть',
        '14 аркан - Умеренность',
        '15 аркан - Дьявол',
        '16 аркан - Башня',
        '17 аркан - Звезда',
        '18 аркан - Луна',
        '19 аркан - Солнце',
        '20 аркан - Страшный суд',
        '21 аркан - Мир',
        // Мечи (14)
        'Туз мечей', 'Двойка мечей', 'Тройка мечей', 'Четверка мечей',
        'Пятерка мечей', 'Шестерка мечей', 'Семерка мечей', 'Восьмерка мечей',
        'Девятка мечей', 'Десятка мечей', 'Король мечей', 'Рыцарь мечей',
        'Паж мечей', 'Королева мечей',
        // Кубки (14)
        'Туз кубков', 'Двойка кубков', 'Тройка кубков', 'Четверка кубков',
        'Пятерка кубков', 'Шестерка кубков', 'Семерка кубков', 'Восьмерка кубков',
        'Девятка кубков', 'Десятка кубков', 'Король кубков', 'Рыцарь кубков',
        'Паж кубков', 'Королева кубков',
        // Жезлы (14)
        'Туз жезлов', 'Двойка жезлов', 'Тройка жезлов', 'Четверка жезлов',
        'Пятерка жезлов', 'Шестерка жезлов', 'Семерка жезлов', 'Восьмерка жезлов',
        'Девятка жезлов', 'Десятка жезлов', 'Король жезлов', 'Рыцарь жезлов',
        'Паж жезлов', 'Королева жезлов',
        // Пентакли (14)
        'Туз пентаклей', 'Двойка пентаклей', 'Тройка пентаклей', 'Четверка пентаклей',
        'Пятерка пентаклей', 'Шестерка пентаклей', 'Семерка пентаклей', 'Восьмерка пентаклей',
        'Девятка пентаклей', 'Десятка пентаклей', 'Король пентаклей', 'Рыцарь пентаклей',
        'Паж пентаклей', 'Королева пентаклей'
      ];

      const CARD_BACK_FILE = 'Обратная сторона.png';

      // =====================================================================
      // 3. THREE.JS СЦЕНА, КАМЕРА И ОСВЕЩЕНИЕ (ВПИСАНО В ФОН.png)
      // =====================================================================
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();

      // Камера настроена так, чтобы 3D-стол органично перекрывал стол на Фон.png (~нижние 32% экрана)
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60);

      function updateCameraForViewport() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const aspect = w / h;
        camera.aspect = aspect;

        // Адаптация под вертикальный телефон и более широкие экраны
        if (aspect < 0.72) {
          camera.fov = 42;
          camera.position.set(0, 3.35, 6.25);
          camera.lookAt(0, 1.05, 0.25);
        } else {
          camera.fov = 38;
          camera.position.set(0, 3.55, 6.65);
          camera.lookAt(0, 0.95, 0.2);
        }
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      updateCameraForViewport();
      window.addEventListener('resize', updateCameraForViewport);

      // Освещение: мягкий мистический полумрак + две тёплые свечи слева и справа как на фоне
      const ambientLight = new THREE.AmbientLight(0x3a131c, 0.85);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0x6b2232, 0x120306, 0.75);
      scene.add(hemiLight);

      // Левая свеча (чуть выше, как на Фон.png)
      const leftCandleLight = new THREE.PointLight(0xff9b48, 4.4, 15, 1.55);
      leftCandleLight.position.set(-3.35, 1.85, -0.45);
      leftCandleLight.castShadow = true;
      leftCandleLight.shadow.mapSize.set(1024, 1024);
      leftCandleLight.shadow.bias = -0.0005;
      scene.add(leftCandleLight);

      // Правая свеча (чуть ниже и ближе, за шторой справа)
      const rightCandleLight = new THREE.PointLight(0xff8e3c, 3.6, 14, 1.6);
      rightCandleLight.position.set(3.45, 1.35, -0.2);
      scene.add(rightCandleLight);

      // Мягкий верхний контровой лунный свет для объёма карт
      const moonRimLight = new THREE.DirectionalLight(0xd9a684, 0.65);
      moonRimLight.position.set(-0.6, 5.8, -2.6);
      moonRimLight.castShadow = true;
      moonRimLight.shadow.mapSize.set(1024, 1024);
      moonRimLight.shadow.camera.near = 1;
      moonRimLight.shadow.camera.far = 14;
      moonRimLight.shadow.camera.left = -4;
      moonRimLight.shadow.camera.right = 4;
      moonRimLight.shadow.camera.top = 4;
      moonRimLight.shadow.camera.bottom = -4;
      moonRimLight.shadow.bias = -0.0006;
      scene.add(moonRimLight);

      // Мягкая фронтальная подсветка при показе карт перед камерой
      const revealSpot = new THREE.PointLight(0xffe1be, 0.0, 9, 1.4);
      revealSpot.position.set(0, 2.7, 4.7);
      scene.add(revealSpot);

      // =====================================================================
      // 4. ПРОЦЕДУРНАЯ ТЕКСТУРА БАРХАТНОЙ СКАТЕРТИ (КАК НА ФОН.png)
      // =====================================================================
      function createVelvetTableTextures() {
        const size = 1024;
        const diffCanvas = document.createElement('canvas');
        diffCanvas.width = size;
        diffCanvas.height = size;
        const ctx = diffCanvas.getContext('2d');

        const bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bctx = bumpCanvas.getContext('2d');

        const cx = size / 2;
        const cy = size / 2;

        // Глубокая бордово-винная бархатная основа
        const baseGrad = ctx.createRadialGradient(cx, cy * 0.96, size * 0.05, cx, cy, size * 0.52);
        baseGrad.addColorStop(0.0, '#620b18');
        baseGrad.addColorStop(0.45, '#460711');
        baseGrad.addColorStop(0.78, '#280308');
        baseGrad.addColorStop(1.0, '#120104');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(0, 0, size, size);

        bctx.fillStyle = '#707070';
        bctx.fillRect(0, 0, size, size);

        // Имитация мятого бархата (мягкие световые пятна + микроворс)
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = 18 + Math.random() * 72;
          const bright = Math.random() > 0.45;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, bright ? 'rgba(130, 18, 34, 0.085)' : 'rgba(10, 0, 2, 0.11)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          const bg = bctx.createRadialGradient(x, y, 0, x, y, r);
          bg.addColorStop(0, bright ? 'rgba(220,220,220,0.08)' : 'rgba(40,40,40,0.08)');
          bg.addColorStop(1, 'rgba(128,128,128,0)');
          bctx.fillStyle = bg;
          bctx.beginPath();
          bctx.arc(x, y, r, 0, Math.PI * 2);
          bctx.fill();
        }

        // Мелкое зерно ворса
        for (let i = 0; i < 9000; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(165, 45, 58, 0.055)' : 'rgba(0, 0, 0, 0.09)';
          ctx.fillRect(x, y, 2, 2);
        }

        // Функция рисования 4/8-лучевой звезды
        function drawStar(targetCtx, x, y, outerR, innerR, points, fill, stroke) {
          targetCtx.save();
          targetCtx.translate(x, y);
          targetCtx.beginPath();
          for (let i = 0; i < points * 2; i++) {
            const r = i % 2 === 0 ? outerR : innerR;
            const a = (i * Math.PI) / points - Math.PI / 2;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) targetCtx.moveTo(px, py);
            else targetCtx.lineTo(px, py);
          }
          targetCtx.closePath();
          if (fill) {
            targetCtx.fillStyle = fill;
            targetCtx.fill();
          }
          if (stroke) {
            targetCtx.strokeStyle = stroke;
            targetCtx.stroke();
          }
          targetCtx.restore();
        }

        // Функция рисования полумесяца
        function drawCrescent(targetCtx, x, y, radius, angle, color) {
          targetCtx.save();
          targetCtx.translate(x, y);
          targetCtx.rotate(angle);
          targetCtx.fillStyle = color;
          targetCtx.beginPath();
          targetCtx.arc(0, 0, radius, 0, Math.PI * 2);
          targetCtx.fill();

          targetCtx.globalCompositeOperation = 'destination-out';
          // Вместо destination-out закрасим бордовым бархатом
          targetCtx.globalCompositeOperation = 'source-over';
          targetCtx.fillStyle = '#33050c';
          targetCtx.beginPath();
          targetCtx.arc(radius * 0.36, 0, radius * 0.84, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.restore();
        }

        // Золотисто-розовая вышивка (в точности в палитре Фон.png)
        const goldMain = 'rgba(206, 152, 118, 0.78)';
        const goldSoft = 'rgba(196, 140, 108, 0.50)';
        const goldBright = 'rgba(225, 176, 138, 0.88)';

        // 1. Внешние двойные кольца у края стола
        ctx.strokeStyle = goldSoft;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.435, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.422, 0, Math.PI * 2);
        ctx.stroke();

        // 2. Центральные концентрические кольца
        ctx.strokeStyle = goldMain;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.145, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.132, 0, Math.PI * 2);
        ctx.stroke();

        // 3. Солнечные лучи вокруг центрального круга
        const rayCount = 48;
        for (let i = 0; i < rayCount; i++) {
          const a = (i / rayCount) * Math.PI * 2;
          const isMajor = i % 4 === 0;
          const isMid = i % 2 === 0;
          const rStart = size * 0.148;
          const rEnd = size * (isMajor ? 0.255 : isMid ? 0.222 : 0.192);
          const halfW = isMajor ? 0.022 : 0.012;

          ctx.fillStyle = isMajor ? goldBright : goldSoft;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a - halfW) * rStart, cy + Math.sin(a - halfW) * rStart);
          ctx.lineTo(cx + Math.cos(a) * rEnd, cy + Math.sin(a) * rEnd);
          ctx.lineTo(cx + Math.cos(a + halfW) * rStart, cy + Math.sin(a + halfW) * rStart);
          ctx.closePath();
          ctx.fill();
        }

        // 4. Центральная 8-лучевая звезда-роза ветров
        drawStar(ctx, cx, cy, size * 0.118, size * 0.024, 4, goldBright, null);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.PI / 4);
        drawStar(ctx, 0, 0, size * 0.072, size * 0.016, 4, goldMain, null);
        ctx.restore();
        drawStar(bctx, cx, cy, size * 0.118, size * 0.024, 4, '#d8d8d8', null);

        // 5. Полумесяцы слева и справа
        drawCrescent(ctx, cx - size * 0.34, cy, size * 0.036, 0.0, goldMain);
        drawCrescent(ctx, cx + size * 0.34, cy, size * 0.036, Math.PI, goldMain);

        // 6. Мелкие звёздочки по периметру
        const starSpots = [
          [0, -0.33, 0.034], [0, 0.33, 0.034],
          [-0.26, -0.22, 0.022], [0.26, -0.22, 0.022],
          [-0.26, 0.23, 0.024], [0.26, 0.23, 0.024],
          [-0.14, 0.31, 0.014], [0.14, 0.31, 0.014],
          [-0.14, -0.31, 0.014], [0.14, -0.31, 0.014]
        ];
        starSpots.forEach(([ox, oy, sr]) => {
          drawStar(ctx, cx + ox * size, cy + oy * size, sr * size, sr * size * 0.24, 4, goldMain, null);
        });

        // Мягкое затенение к самому краю для естественного перехода в фон
        const edgeFade = ctx.createRadialGradient(cx, cy, size * 0.32, cx, cy, size * 0.5);
        edgeFade.addColorStop(0, 'rgba(0,0,0,0)');
        edgeFade.addColorStop(1, 'rgba(8, 1, 3, 0.55)');
        ctx.fillStyle = edgeFade;
        ctx.fillRect(0, 0, size, size);

        const diffuseTex = new THREE.CanvasTexture(diffCanvas);
        diffuseTex.colorSpace = THREE.SRGBColorSpace;
        diffuseTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const bumpTex = new THREE.CanvasTexture(bumpCanvas);
        return { diffuseTex, bumpTex };
      }

      // =====================================================================
      // 5. 3D-СТОЛ С БАРХАТНОЙ СКАТЕРТЬЮ И СКЛАДКАМИ
      // =====================================================================
      const TABLE_Y = 0.0;
      const TABLE_RADIUS = 3.85;
      const { diffuseTex, bumpTex } = createVelvetTableTextures();

      const tableGroup = new THREE.Group();
      scene.add(tableGroup);

      // Столешница
      const tableTopGeo = new THREE.CylinderGeometry(TABLE_RADIUS, TABLE_RADIUS * 1.01, 0.14, 72, 1, false);
      const tableTopMat = new THREE.MeshStandardMaterial({
        map: diffuseTex,
        bumpMap: bumpTex,
        bumpScale: 0.025,
        roughness: 0.84,
        metalness: 0.08
      });
      const tableTopMesh = new THREE.Mesh(tableTopGeo, tableTopMat);
      tableTopMesh.position.y = TABLE_Y - 0.07;
      tableTopMesh.receiveShadow = true;
      tableGroup.add(tableTopMesh);

      // Драпированная юбка скатерти со складками по периметру
      const skirtGeo = new THREE.CylinderGeometry(TABLE_RADIUS * 1.005, TABLE_RADIUS * 1.14, 2.35, 96, 12, true);
      const posAttr = skirtGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = posAttr.getZ(i);
        const angle = Math.atan2(z, x);
        // Чем ниже по юбке, тем глубже складки
        const depthFactor = THREE.MathUtils.clamp((1.175 - y) / 2.35, 0, 1);
        const fold =
          Math.sin(angle * 18) * 0.065 +
          Math.sin(angle * 31 + 1.1) * 0.03 +
          Math.cos(angle * 9) * 0.04;
        const r = Math.hypot(x, z) + fold * depthFactor;
        posAttr.setX(i, Math.cos(angle) * r);
        posAttr.setZ(i, Math.sin(angle) * r);
      }
      skirtGeo.computeVertexNormals();

      const skirtMat = new THREE.MeshStandardMaterial({
        color: 0x38050d,
        bumpMap: bumpTex,
        bumpScale: 0.035,
        roughness: 0.88,
        metalness: 0.04
      });
      const skirtMesh = new THREE.Mesh(skirtGeo, skirtMat);
      skirtMesh.position.y = TABLE_Y - 1.24;
      skirtMesh.receiveShadow = true;
      tableGroup.add(skirtMesh);

      // =====================================================================
      // 6. ЗАГРУЗКА ТЕКСТУР КАРТ + КРАСИВЫЕ ПРОЦЕДУРНЫЕ ЗАГЛУШКИ (FALLBACK)
      // =====================================================================
      const texLoader = new THREE.TextureLoader();

      function createFallbackBackTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 864;
        const g = c.getContext('2d');

        const grad = g.createLinearGradient(0, 0, 512, 864);
        grad.addColorStop(0, '#1e050b');
        grad.addColorStop(0.5, '#3b0914');
        grad.addColorStop(1, '#180308');
        g.fillStyle = grad;
        g.fillRect(0, 0, 512, 864);

        g.strokeStyle = '#d3a372';
        g.lineWidth = 8;
        g.strokeRect(24, 24, 464, 816);
        g.lineWidth = 2.5;
        g.strokeRect(38, 38, 436, 788);

        g.save();
        g.translate(256, 432);
        g.strokeStyle = 'rgba(218, 170, 120, 0.85)';
        g.lineWidth = 3;
        g.beginPath();
        g.arc(0, 0, 130, 0, Math.PI * 2);
        g.stroke();
        g.beginPath();
        g.arc(0, 0, 108, 0, Math.PI * 2);
        g.stroke();

        // Звезда в центре рубашки
        g.fillStyle = '#e0b484';
        g.beginPath();
        for (let i = 0; i < 16; i++) {
          const r = i % 2 === 0 ? 95 : 22;
          const a = (i * Math.PI) / 8 - Math.PI / 2;
          if (i === 0) g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
          else g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        g.closePath();
        g.fill();
        g.restore();

        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      function createFallbackFaceTexture(cardName) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 864;
        const g = c.getContext('2d');

        const bg = g.createLinearGradient(0, 0, 0, 864);
        bg.addColorStop(0, '#1c0b12');
        bg.addColorStop(0.5, '#2c1118');
        bg.addColorStop(1, '#12060a');
        g.fillStyle = bg;
        g.fillRect(0, 0, 512, 864);

        g.strokeStyle = '#d9ae7e';
        g.lineWidth = 9;
        g.strokeRect(22, 22, 468, 820);
        g.lineWidth = 2;
        g.strokeRect(38, 38, 436, 788);

        // Символический круг
        g.strokeStyle = 'rgba(222, 178, 128, 0.65)';
        g.lineWidth = 3;
        g.beginPath();
        g.arc(256, 360, 145, 0, Math.PI * 2);
        g.stroke();

        g.fillStyle = '#e5be91';
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 === 0 ? 96 : 24;
          const a = (i * Math.PI) / 4 - Math.PI / 2;
          if (i === 0) g.moveTo(256 + Math.cos(a) * r, 360 + Math.sin(a) * r);
          else g.lineTo(256 + Math.cos(a) * r, 360 + Math.sin(a) * r);
        }
        g.closePath();
        g.fill();

        // Название карты
        g.fillStyle = '#f3dcc0';
        g.font = '600 34px Georgia, serif';
        g.textAlign = 'center';
        const words = cardName.split(' ');
        let lines = [];
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (g.measureText(test).width > 380) {
            lines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        lines.forEach((ln, idx) => {
          g.fillText(ln, 256, 650 + idx * 44);
        });

        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      const backMaterial = new THREE.MeshStandardMaterial({
        map: createFallbackBackTexture(),
        roughness: 0.46,
        metalness: 0.14
      });

      // Загружаем реальную рубашку «Обратная сторона.png»
      texLoader.load(
        encodeURI(CARD_BACK_FILE),
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          backMaterial.map = tex;
          backMaterial.needsUpdate = true;
        },
        undefined,
        () => {
          // Оставляем красивую процедурную заглушку, если файла ещё нет рядом
        }
      );

      // Кэш лицевых текстур (подгружаем по мере выпадения для 60 FPS на мобильных)
      const faceTextureCache = new Map();
      function loadCardFaceTexture(cardName, onLoaded) {
        if (faceTextureCache.has(cardName)) {
          onLoaded(faceTextureCache.get(cardName));
          return;
        }
        const candidates = [encodeURI(cardName + '.png')];
        // На случай двойного пробела в «8 аркан -  Сила.png»
        if (cardName === '8 аркан - Сила') {
          candidates.push(encodeURI('8 аркан -  Сила.png'));
        }

        function tryIndex(idx) {
          if (idx >= candidates.length) {
            const fb = createFallbackFaceTexture(cardName);
            faceTextureCache.set(cardName, fb);
            onLoaded(fb);
            return;
          }
          texLoader.load(
            candidates[idx],
            (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
              faceTextureCache.set(cardName, tex);
              onLoaded(tex);
            },
            undefined,
            () => tryIndex(idx + 1)
          );
        }
        tryIndex(0);
      }

      // =====================================================================
      // 7. СОЗДАНИЕ 78 ОБЪЁМНЫХ 3D-КАРТ (ПЛОТНЫЙ КАРТОН ТАРО)
      // =====================================================================
      const CARD_W = 0.78;
      const CARD_H = 1.32;
      const CARD_THICKNESS = 0.0082; // Реалистичная толщина плотной карты Таро
      const DECK_HOME = new THREE.Vector3(0, TABLE_Y, -1.28); // Центр стола ближе к стене

      const cardGeometry = new THREE.BoxGeometry(CARD_W, CARD_THICKNESS, CARD_H);

      // Материал торца карты (лёгкий состаренный позолоченный картон)
      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: 0xc9a374,
        roughness: 0.55,
        metalness: 0.25
      });

      const defaultHiddenFaceMat = new THREE.MeshStandardMaterial({
        color: 0x1b080d,
        roughness: 0.5,
        metalness: 0.1
      });

      const cards = [];
      const deckGroup = new THREE.Group();
      scene.add(deckGroup);

      // Порядок индексов карт в колоде (0 = нижняя, 77 = верхняя)
      let deckOrder = [];

      for (let i = 0; i < TAROT_CARDS.length; i++) {
        // Грани BoxGeometry: [right, left, top (+Y = рубашка), bottom (-Y = лицо), front, back]
        const materials = [
          edgeMaterial,
          edgeMaterial,
          backMaterial,
          defaultHiddenFaceMat,
          edgeMaterial,
          edgeMaterial
        ];
        const mesh = new THREE.Mesh(cardGeometry, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const jitterX = (Math.random() - 0.5) * 0.014;
        const jitterZ = (Math.random() - 0.5) * 0.014;
        const jitterYRot = (Math.random() - 0.5) * 0.032;

        const cardObj = {
          id: i,
          name: TAROT_CARDS[i],
          mesh,
          jitterX,
          jitterZ,
          jitterYRot,
          // Анимационные состояния
          startPos: new THREE.Vector3(),
          endPos: new THREE.Vector3(),
          startQuat: new THREE.Quaternion(),
          endQuat: new THREE.Quaternion()
        };

        cards.push(cardObj);
        deckOrder.push(i);
        deckGroup.add(mesh);
      }

      function placeDeckAtHome(instant = true) {
        for (let stackIdx = 0; stackIdx < deckOrder.length; stackIdx++) {
          const c = cards[deckOrder[stackIdx]];
          const targetY = TABLE_Y + CARD_THICKNESS * 0.5 + stackIdx * (CARD_THICKNESS * 1.03);
          if (instant) {
            c.mesh.position.set(
              DECK_HOME.x + c.jitterX,
              targetY,
              DECK_HOME.z + c.jitterZ
            );
            c.mesh.rotation.set(0, c.jitterYRot, 0);
          }
        }
      }
      placeDeckAtHome(true);

      // =====================================================================
      // 8. МАГИЧЕСКОЕ СВЕЧЕНИЕ, ДЫМОК И ЧАСТИЦЫ ВОКРУГ КОЛОДЫ
      // =====================================================================
      function createSoftGlowSprite(innerColor, outerColor) {
        const c = document.createElement('canvas');
        c.width = 128;
        c.height = 128;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(64, 64, 2, 64, 64, 62);
        grad.addColorStop(0, innerColor);
        grad.addColorStop(0.45, outerColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      // Аура под колодой на столе
      const deckAuraGeo = new THREE.PlaneGeometry(2.2, 2.6);
      const deckAuraMat = new THREE.MeshBasicMaterial({
        map: createSoftGlowSprite('rgba(255, 198, 132, 0.58)', 'rgba(175, 42, 62, 0.22)'),
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.72
      });
      const deckAura = new THREE.Mesh(deckAuraGeo, deckAuraMat);
      deckAura.rotation.x = -Math.PI / 2;
      deckAura.position.set(DECK_HOME.x, TABLE_Y + 0.008, DECK_HOME.z);
      scene.add(deckAura);

      // Магический дымок (мягкие клубы вверх)
      const SMOKE_COUNT = 26;
      const smokeGeo = new THREE.BufferGeometry();
      const smokePositions = new Float32Array(SMOKE_COUNT * 3);
      const smokeData = [];
      for (let i = 0; i < SMOKE_COUNT; i++) {
        smokeData.push({
          angle: Math.random() * Math.PI * 2,
          radius: 0.15 + Math.random() * 0.52,
          speed: 0.22 + Math.random() * 0.26,
          phase: Math.random()
        });
      }
      smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
      const smokeMat = new THREE.PointsMaterial({
        map: createSoftGlowSprite('rgba(228, 165, 132, 0.22)', 'rgba(130, 32, 52, 0.09)'),
        size: 1.05,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.55
      });
      const smokePoints = new THREE.Points(smokeGeo, smokeMat);
      scene.add(smokePoints);

      // Золотые искры-частицы
      const SPARK_COUNT = 54;
      const sparkGeo = new THREE.BufferGeometry();
      const sparkPositions = new Float32Array(SPARK_COUNT * 3);
      const sparkData = [];
      for (let i = 0; i < SPARK_COUNT; i++) {
        sparkData.push({
          angle: Math.random() * Math.PI * 2,
          radius: 0.2 + Math.random() * 0.78,
          speed: 0.32 + Math.random() * 0.52,
          phase: Math.random(),
          swirl: (Math.random() - 0.5) * 1.4
        });
      }
      sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
      const sparkMat = new THREE.PointsMaterial({
        map: createSoftGlowSprite('rgba(255, 228, 172, 0.95)', 'rgba(235, 146, 74, 0.35)'),
        size: 0.14,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.85
      });
      const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
      scene.add(sparkPoints);

      let magicEffectsIntensity = 1.0;

      function updateMagicParticles(time, dt) {
        const auraPulse = 0.62 + Math.sin(time * 2.2) * 0.16;
        deckAuraMat.opacity = auraPulse * magicEffectsIntensity;
        const auraScale = 1.0 + Math.sin(time * 1.7) * 0.05;
        deckAura.scale.set(auraScale, auraScale, 1);

        smokeMat.opacity = 0.48 * magicEffectsIntensity;
        sparkMat.opacity = 0.85 * magicEffectsIntensity;

        const sp = smokeGeo.attributes.position.array;
        for (let i = 0; i < SMOKE_COUNT; i++) {
          const d = smokeData[i];
          d.phase = (d.phase + dt * d.speed * 0.35) % 1;
          const y = TABLE_Y + 0.15 + d.phase * 1.85;
          const r = d.radius + d.phase * 0.35;
          const a = d.angle + time * 0.25 + d.phase * 1.2;
          sp[i * 3] = DECK_HOME.x + Math.cos(a) * r;
          sp[i * 3 + 1] = y;
          sp[i * 3 + 2] = DECK_HOME.z + Math.sin(a) * r * 0.85;
        }
        smokeGeo.attributes.position.needsUpdate = true;

        const kp = sparkGeo.attributes.position.array;
        for (let i = 0; i < SPARK_COUNT; i++) {
          const d = sparkData[i];
          d.phase = (d.phase + dt * d.speed * 0.42) % 1;
          const y = TABLE_Y + 0.08 + d.phase * 2.15;
          const r = d.radius * (0.85 + d.phase * 0.45);
          const a = d.angle + time * d.swirl;
          kp[i * 3] = DECK_HOME.x + Math.cos(a) * r;
          kp[i * 3 + 1] = y;
          kp[i * 3 + 2] = DECK_HOME.z + Math.sin(a) * r;
        }
        sparkGeo.attributes.position.needsUpdate = true;
      }

      // =====================================================================
      // 9. УТИЛИТЫ АНИМАЦИИ И ПЛАВНЫХ ПЕРЕХОДОВ
      // =====================================================================
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;

      function waitMs(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function animateDuration(durationMs, onUpdate) {
        return new Promise((resolve) => {
          const start = performance.now();
          function step(now) {
            const raw = Math.min((now - start) / durationMs, 1);
            onUpdate(raw);
            if (raw < 1) requestAnimationFrame(step);
            else resolve();
          }
          requestAnimationFrame(step);
        });
      }

      function fisherYatesShuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // =====================================================================
      // 10. РЕАЛИСТИЧНЫЕ 3D-ТАСОВКИ КАРТ ТАРО (НЕВИДИМЫЕ РУКИ)
      // =====================================================================

      // Подъём всей колоды в «невидимые руки» над центром стола
      async function animLiftDeckToHands(centerPos = new THREE.Vector3(0, 1.32, -0.35), tiltEuler = new THREE.Euler(0.24, 0.16, 0.14)) {
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const targetQuat = new THREE.Quaternion().setFromEuler(tiltEuler);
        const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(targetQuat);

        await animateDuration(520, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const c = cards[deckOrder[i]];
            const offset = (i - deckOrder.length / 2) * (CARD_THICKNESS * 1.03);
            const dst = centerPos.clone().addScaledVector(upVec, offset);
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, targetQuat, t);
          }
        });
      }

      // ТАСОВКА 1: Перебор по одной карте и пачками в нижнюю руку + сброс остатка назад
      async function shuffleOverhand() {
        const handTop = new THREE.Vector3(0.42, 1.48, -0.32);
        const handBot = new THREE.Vector3(-0.34, 1.12, -0.26);
        const qTop = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.22, -0.18, 0.34));
        const qBot = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.18, 0.12, -0.08));

        // Перемещаем колоду в верхнюю руку
        await animLiftDeckToHands(handTop, new THREE.Euler(0.22, -0.18, 0.34));
        haptic('light');

        // Разбиваем на шаги: несколько одиночных карт + пачки + остаток назад
        const dropSteps = [1, 1, 1, 2, 1, 5, 1, 1, 8, 12, 1, 1, 10];
        let remaining = [...deckOrder];
        let lowerHand = [];

        const upBot = new THREE.Vector3(0, 1, 0).applyQuaternion(qBot);

        for (const count of dropSteps) {
          if (remaining.length <= 16) break;
          const chunk = remaining.splice(remaining.length - count, count);
          const startStates = chunk.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));
          const baseIdx = lowerHand.length;
          lowerHand.push(...chunk);

          const dur = count === 1 ? 110 : 185;
          await animateDuration(dur, (raw) => {
            const t = easeOutCubic(raw);
            for (let k = 0; k < chunk.length; k++) {
              const c = cards[chunk[k]];
              const dst = handBot.clone().addScaledVector(upBot, (baseIdx + k - 39) * CARD_THICKNESS * 1.04);
              c.mesh.position.lerpVectors(startStates[k].pos, dst, t);
              c.mesh.position.y += Math.sin(t * Math.PI) * (0.14 + k * 0.008);
              c.mesh.quaternion.slerpQuaternions(startStates[k].quat, qBot, t);
            }
          });
        }

        // Остаток из верхней руки эффектно бросается в конец (под низ) колоды
        if (remaining.length > 0) {
          const restStarts = remaining.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));
          // Новый порядок: остаток уходит вниз
          deckOrder = [...remaining, ...lowerHand];
          const allStarts = deckOrder.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));

          haptic('medium');
          await animateDuration(360, (raw) => {
            const t = easeInOutCubic(raw);
            for (let i = 0; i < deckOrder.length; i++) {
              const c = cards[deckOrder[i]];
              const dst = new THREE.Vector3(0, 1.28, -0.32).addScaledVector(upBot, (i - 39) * CARD_THICKNESS * 1.03);
              c.mesh.position.lerpVectors(allStarts[i].pos, dst, t);
              if (i < remaining.length) {
                // Дуга под низ колоды
                c.mesh.position.z -= Math.sin(t * Math.PI) * 0.55;
                c.mesh.position.y -= Math.sin(t * Math.PI) * 0.25;
              }
              c.mesh.quaternion.slerpQuaternions(allStarts[i].quat, qBot, t);
            }
          });
        }
      }

      // ТАСОВКА 2: Вытягивание толстых пачек (20-30 карт) из середины в начало и в конец
      async function shuffleCenterPacketPulls() {
        const center = new THREE.Vector3(0, 1.32, -0.32);
        const holdEuler = new THREE.Euler(0.24, 0.06, 0.04);
        const holdQuat = new THREE.Quaternion().setFromEuler(holdEuler);
        const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(holdQuat);

        await animLiftDeckToHands(center, holdEuler);

        // 2 раза вытягиваем середину: один раз наверх (в начало), второй раз вниз (в конец)
        const moves = [
          { toTop: true, sideSign: 1 },
          { toTop: false, sideSign: -1 }
        ];

        for (const move of moves) {
          const packetSize = 20 + Math.floor(Math.random() * 12); // 20..31 карта
          const startIdx = Math.floor((deckOrder.length - packetSize) / 2);
          const bottomPart = deckOrder.slice(0, startIdx);
          const middlePart = deckOrder.slice(startIdx, startIdx + packetSize);
          const topPart = deckOrder.slice(startIdx + packetSize);

          const midStarts = middlePart.map((id) => cards[id].mesh.position.clone());
          haptic('light');

          // Фаза 1: Выдвигаем середину вбок
          await animateDuration(260, (raw) => {
            const t = easeOutCubic(raw);
            for (let k = 0; k < middlePart.length; k++) {
              const c = cards[middlePart[k]];
              c.mesh.position.copy(midStarts[k]);
              c.mesh.position.x += move.sideSign * 1.05 * t;
              c.mesh.position.z += 0.14 * t;
            }
          });

          // Новый порядок
          deckOrder = move.toTop
            ? [...bottomPart, ...topPart, ...middlePart]
            : [...middlePart, ...bottomPart, ...topPart];

          const phase2Starts = deckOrder.map((id) => cards[id].mesh.position.clone());

          // Фаза 2: Переносим по дуге наверх или под низ и смыкаем колоду
          await animateDuration(360, (raw) => {
            const t = easeInOutCubic(raw);
            for (let i = 0; i < deckOrder.length; i++) {
              const id = deckOrder[i];
              const c = cards[id];
              const dst = center.clone().addScaledVector(upVec, (i - 39) * CARD_THICKNESS * 1.03);
              c.mesh.position.lerpVectors(phase2Starts[i], dst, t);
              const isMoved = middlePart.includes(id);
              if (isMoved) {
                c.mesh.position.y += (move.toTop ? 0.36 : -0.34) * Math.sin(t * Math.PI);
                c.mesh.position.x += move.sideSign * 0.22 * Math.sin(t * Math.PI);
              }
              c.mesh.quaternion.copy(holdQuat);
            }
          });
        }
      }

      // ТАСОВКА 3: Настольный Риффл (колода делится на 2 половины на столе, пролистывается друг в друга и выравнивается)
      async function shuffleTableRiffle() {
        const half = 39;
        const leftHalf = deckOrder.slice(0, half);
        const rightHalf = deckOrder.slice(half);

        const leftPos = new THREE.Vector3(-0.62, TABLE_Y, -0.38);
        const rightPos = new THREE.Vector3(0.62, TABLE_Y, -0.38);
        const qLeft = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0.16, 0));
        const qRight = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -0.16, 0));

        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));

        // 1. Опускаем и делим на две стопки на бархатном столе
        await animateDuration(460, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const isLeft = i < half;
            const localIdx = isLeft ? i : i - half;
            const base = isLeft ? leftPos : rightPos;
            const dst = new THREE.Vector3(base.x, TABLE_Y + CARD_THICKNESS * 0.5 + localIdx * CARD_THICKNESS * 1.05, base.z);
            const c = cards[deckOrder[i]];
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.28;
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, isLeft ? qLeft : qRight, t);
          }
        });

        haptic('medium');

        // 2. Пролистывание (риффл) — карты поочерёдно слетают и входят друг в друга
        const interleaved = [];
        let li = 0, ri = 0;
        while (li < leftHalf.length || ri < rightHalf.length) {
          const takeLeft = li < leftHalf.length && (ri >= rightHalf.length || Math.random() < 0.52);
          if (takeLeft) interleaved.push({ id: leftHalf[li++], side: -1 });
          else interleaved.push({ id: rightHalf[ri++], side: 1 });
        }

        const riffleStarts = interleaved.map((item) => ({
          pos: cards[item.id].mesh.position.clone(),
          quat: cards[item.id].mesh.quaternion.clone()
        }));

        await animateDuration(860, (raw) => {
          for (let i = 0; i < interleaved.length; i++) {
            const item = interleaved[i];
            const c = cards[item.id];
            // Каждая карта стартует со смещением (эффект «тррррр» пролистывания снизу вверх)
            const delay = (i / interleaved.length) * 0.65;
            const localT = THREE.MathUtils.clamp((raw - delay) / 0.35, 0, 1);
            const t = easeOutCubic(localT);

            const targetX = item.side * 0.16; // Слегка внахлёст, прежде чем сдвинуть вместе
            const targetY = TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_THICKNESS * 1.04;
            const targetZ = -0.38;

            c.mesh.position.set(
              THREE.MathUtils.lerp(riffleStarts[i].pos.x, targetX, t),
              THREE.MathUtils.lerp(riffleStarts[i].pos.y, targetY, t) + Math.sin(localT * Math.PI) * 0.24,
              THREE.MathUtils.lerp(riffleStarts[i].pos.z, targetZ, t)
            );

            // Лёгкий наклон карты во время падения внахлёст
            const tiltZ = -item.side * Math.sin(localT * Math.PI) * 0.38;
            c.mesh.rotation.set(0, item.side * -0.05 * (1 - t), tiltZ);
          }
        });

        deckOrder = interleaved.map((it) => it.id);

        // 3. Аккуратно сдвигаем и выравниваем («подбиваем») стопку невидимыми руками
        const sqStarts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const qFlat = new THREE.Quaternion();

        haptic('light');
        await animateDuration(320, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const c = cards[deckOrder[i]];
            const dst = new THREE.Vector3(c.jitterX, TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_THICKNESS * 1.03, -0.38 + c.jitterZ);
            c.mesh.position.lerpVectors(sqStarts[i].pos, dst, t);
            c.mesh.quaternion.slerpQuaternions(sqStarts[i].quat, qFlat, t);
          }
        });
      }

      // ТАСОВКА 4: «Гармошка» / Каскадный перелёт (Card Spring со сгибом из руки в руку)
      async function shuffleCardSpring() {
        const leftHand = new THREE.Vector3(-0.98, 1.48, -0.30);
        const rightHand = new THREE.Vector3(0.98, 1.24, -0.30);

        const qLeft = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.24, 0.28, -0.46));
        const qRight = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.20, -0.24, 0.34));

        // Переводим всю колоду в левую невидимую руку
        await animLiftDeckToHands(leftHand, new THREE.Euler(0.24, 0.28, -0.46));
        haptic('medium');

        const upRight = new THREE.Vector3(0, 1, 0).applyQuaternion(qRight);
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));

        // Все 78 карт веерной дугой перелетают из левой руки в правую с изгибом/разворотом в полёте
        await animateDuration(1050, (raw) => {
          const total = deckOrder.length;
          for (let i = 0; i < total; i++) {
            const c = cards[deckOrder[i]];
            const delay = (i / total) * 0.62;
            const localT = THREE.MathUtils.clamp((raw - delay) / 0.38, 0, 1);
            const t = easeInOutSine(localT);

            const dst = rightHand.clone().addScaledVector(upRight, (i - 39) * CARD_THICKNESS * 1.03);
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);

            // Высокая параболическая дуга гармошки
            const arc = Math.sin(localT * Math.PI);
            c.mesh.position.y += arc * 0.56;
            c.mesh.position.z += arc * 0.22;

            // Динамический наклон, передающий упругий «выстрел» плотной карты Таро
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, qRight, t);
            if (localT > 0 && localT < 1) {
              c.mesh.rotateZ(-arc * 0.55);
              c.mesh.rotateX(arc * 0.18);
            }
          }
        });

        // Возвращаем в центр в руках
        await animLiftDeckToHands(new THREE.Vector3(0, 1.32, -0.32), new THREE.Euler(0.2, 0, 0));
      }

      // Возврат колоды на исходную позицию в начало стола (ближе к стене)
      async function animReturnDeckHome() {
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const qFlat = new THREE.Quaternion();

        await animateDuration(540, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const c = cards[deckOrder[i]];
            const dst = new THREE.Vector3(
              DECK_HOME.x + c.jitterX,
              TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_THICKNESS * 1.03,
              DECK_HOME.z + c.jitterZ
            );
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.22;
            const targetQ = qFlat.clone().setFromEuler(new THREE.Euler(0, c.jitterYRot, 0));
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, targetQ, t);
          }
        });
      }

      // =====================================================================
      // 11. ВЫДАЧА 3 КАРТ НА СТОЛ, ПОДЪЁМ НА 90°, РАЗВОРОТ НА 3 СЕК И ОПУСКАНИЕ
      // =====================================================================
      const SPREAD_SLOTS = [
        new THREE.Vector3(-1.02, TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.92),
        new THREE.Vector3(0.0,   TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.98),
        new THREE.Vector3(1.02,  TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.92)
      ];

      let drawnCards = [];
      let appState = 'IDLE'; // IDLE | SHUFFLING | DEALING | REVEALING | DONE

      const topStatusEl = document.getElementById('top-status');
      const statusTitleEl = document.getElementById('status-title');
      const statusSubtitleEl = document.getElementById('status-subtitle');
      const hintPillEl = document.getElementById('hint-pill');
      const cardsBannerEl = document.getElementById('cards-banner');
      const resetBtnEl = document.getElementById('reset-btn');

      function setStatus(title, subtitle, visible = true) {
        statusTitleEl.textContent = title;
        statusSubtitleEl.textContent = subtitle;
        topStatusEl.classList.toggle('visible', visible);
      }

      // Показываем стартовый заголовок мягко
      setTimeout(() => setStatus('Расклад Таро', 'Сосредоточьтесь на своём вопросе', true), 350);

      async function runTarotReading() {
        if (appState !== 'IDLE') return;
        appState = 'SHUFFLING';
        haptic('medium');

        hintPillEl.classList.add('hidden');
        cardsBannerEl.classList.remove('visible');
        resetBtnEl.classList.remove('visible');
        setStatus('Тасуем колоду', 'Карты настраиваются на ваш вопрос…', true);

        // Приглушаем свечение под пустым местом, пока колода в воздухе
        animateDuration(400, (t) => { magicEffectsIntensity = 1.0 - 0.72 * t; });

        // Настоящая случайная перетасовка данных 78 карт
        fisherYatesShuffle(deckOrder);

        // Случайная комбинация из 3 реалистичных тасовок для каждого расклада
        const allShuffles = [
          shuffleOverhand,
          shuffleCenterPacketPulls,
          shuffleTableRiffle,
          shuffleCardSpring
        ];
        const chosen = fisherYatesShuffle([...allShuffles]).slice(0, 3);

        // Заранее выбираем 3 верхние карты после будущего перемешивания (или сразу после chosen)
        for (const fn of chosen) {
          await fn();
        }

        // Дополнительное финальное случайное перемешивание индексов перед выдачей
        fisherYatesShuffle(deckOrder);

        // Возвращаем колоду на место в начало стола (ближе к стене)
        await animReturnDeckHome();

        // Берём 3 верхние карты для расклада
        appState = 'DEALING';
        setStatus('Выбираем карты', 'Три карты ложатся на стол…', true);
        drawnCards = [
          cards[deckOrder.pop()],
          cards[deckOrder.pop()],
          cards[deckOrder.pop()]
        ];

        // Загружаем PNG-текстуры для 3 выпавших карт заранее, пока они едут на стол
        drawnCards.forEach((c) => {
          loadCardFaceTexture(c.name, (tex) => {
            c.mesh.material[3] = new THREE.MeshStandardMaterial({
              map: tex,
              roughness: 0.42,
              metalness: 0.08
            });
          });
        });

        // Выдаём по одной карте на стол в ряд ближе к камере (рубашкой вверх)
        for (let i = 0; i < 3; i++) {
          const c = drawnCards[i];
          const startPos = c.mesh.position.clone();
          const startQuat = c.mesh.quaternion.clone();
          const endPos = SPREAD_SLOTS[i].clone();
          const endQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, (i - 1) * -0.04, 0));

          haptic('light');
          await animateDuration(420, (raw) => {
            const t = easeOutCubic(raw);
            c.mesh.position.lerpVectors(startPos, endPos, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.42;
            c.mesh.quaternion.slerpQuaternions(startQuat, endQuat, t);
          });
          await waitMs(90);
        }

        await waitMs(380);

        // ПОДЪЁМ РОВНО НА 90° ПЕРЕД КАМЕРОЙ И РАЗВОРОТ ЛИЦОМ К ПОЛЬЗОВАТЕЛЮ
        appState = 'REVEALING';
        setStatus('Ваш расклад', 'Откровение карт', true);
        haptic('success');

        // Вычисляем 3 позиции прямо перед камерой (аккуратный ряд в кадре)
        const camForward = new THREE.Vector3();
        camera.getWorldDirection(camForward);
        const camRight = new THREE.Vector3().crossVectors(camForward, camera.up).normalize();
        const camUp = new THREE.Vector3().crossVectors(camRight, camForward).normalize();

        const isNarrow = window.innerWidth / window.innerHeight < 0.62;
        const distFromCam = isNarrow ? 3.45 : 3.15;
        const spacing = isNarrow ? 0.86 : 0.96;

        const revealCenter = camera.position.clone()
          .addScaledVector(camForward, distFromCam)
          .addScaledVector(camUp, -0.05);

        // Кватернион: карта стоит ровно 90° перпендикулярно взгляду камеры, лицевой стороной (-Y) к камере
        // Локальная ось -Y должна смотреть на -camForward (к камере), локальная -Z вверх (camUp), локальная +X вправо
        const rotMatrix = new THREE.Matrix4().makeBasis(
          camRight.clone(),
          camForward.clone(),      // +Y (рубашка) смотрит ОТ камеры; -Y (лицо) смотрит НА камеру!
          camUp.clone().negate()   // +Z смотрит вниз, -Z (верх карты) смотрит вверх
        );
        const revealFaceQuat = new THREE.Quaternion().setFromRotationMatrix(rotMatrix);

        // Промежуточный кватернион (подняты на 90°, но ещё рубашкой к камере)
        const rotBackMatrix = new THREE.Matrix4().makeBasis(
          camRight.clone().negate(),
          camForward.clone().negate(),
          camUp.clone().negate()
        );
        const revealBackQuat = new THREE.Quaternion().setFromRotationMatrix(rotBackMatrix);

        const dealStarts = drawnCards.map((c) => ({
          pos: c.mesh.position.clone(),
          quat: c.mesh.quaternion.clone()
        }));

        const revealTargets = drawnCards.map((_, i) =>
          revealCenter.clone().addScaledVector(camRight, (i - 1) * spacing)
        );

        // Шаг 1: Поднимаем карты ровно 90° перед камерой (ещё рубашкой)
        await animateDuration(520, (raw) => {
          const t = easeOutCubic(raw);
          revealSpot.intensity = 2.4 * t;
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            c.mesh.position.lerpVectors(dealStarts[i].pos, revealTargets[i], t);
            c.mesh.quaternion.slerpQuaternions(dealStarts[i].quat, revealBackQuat, t);
          }
        });

        // Шаг 2: Разворот лицом к камере (плавный 180° поворот вокруг вертикальной оси карты)
        await animateDuration(640, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            // Небольшая задержка между картами для кинематографичности
            const localT = THREE.MathUtils.clamp((raw - i * 0.08) / 0.84, 0, 1);
            const eased = easeInOutCubic(localT);
            const spin = new THREE.Quaternion().setFromAxisAngle(camUp, Math.PI * eased);
            c.mesh.quaternion.copy(spin).multiply(revealBackQuat);
            c.mesh.position.copy(revealTargets[i]);
            c.mesh.position.addScaledVector(camForward, -Math.sin(eased * Math.PI) * 0.14);
          }
        });

        // Показываем названия выпавших карт
        cardsBannerEl.innerHTML = drawnCards
          .map((c, idx) => `
            <div class="card-label">
              <div class="pos">Карта ${idx + 1}</div>
              <div class="name">${c.name}</div>
            </div>
          `)
          .join('');
        cardsBannerEl.classList.add('visible');

        // Держим ровно 3 секунды перед камерой, чтобы рассмотреть значения
        await waitMs(3000);

        // Опускаем карты обратно на стол ЛИЦОМ ВВЕРХ и оставляем лежать на столе
        const downStarts = drawnCards.map((c) => ({
          pos: c.mesh.position.clone(),
          quat: c.mesh.quaternion.clone()
        }));

        await animateDuration(680, (raw) => {
          const t = easeInOutCubic(raw);
          revealSpot.intensity = 2.4 * (1 - t);
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            const dstPos = SPREAD_SLOTS[i].clone();
            // Лежат на столе лицом вверх (поворот по Z на PI переворачивает -Y вверх)
            const dstQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, (i - 1) * -0.04, Math.PI));
            c.mesh.position.lerpVectors(downStarts[i].pos, dstPos, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.25;
            c.mesh.quaternion.slerpQuaternions(downStarts[i].quat, dstQuat, t);
          }
        });

        // Возвращаем мягкое свечение колоде на заднем плане
        animateDuration(600, (t) => { magicEffectsIntensity = 0.28 + 0.52 * t; });

        appState = 'DONE';
        setStatus('Расклад готов', 'Три карты открыты на столе', true);
        resetBtnEl.classList.add('visible');

        // Сохраняем результат в window для будущей интеграции с Python-ботом и нейронкой
        window.LAST_TAROT_READING = drawnCards.map((c, idx) => ({
          position: idx + 1,
          card: c.name
        }));
      }

      // Сброс для нового расклада
      async function resetReading() {
        if (appState !== 'DONE') return;
        appState = 'SHUFFLING';
        haptic('light');

        resetBtnEl.classList.remove('visible');
        cardsBannerEl.classList.remove('visible');

        // Возвращаем 3 карты обратно в колоду
        deckOrder.push(...drawnCards.map((c) => c.id));
        drawnCards = [];

        await animReturnDeckHome();
        animateDuration(450, (t) => { magicEffectsIntensity = 0.8 + 0.2 * t; });

        appState = 'IDLE';
        setStatus('Расклад Таро', 'Сосредоточьтесь на своём вопросе', true);
        hintPillEl.classList.remove('hidden');
      }

      resetBtnEl.addEventListener('click', resetReading);

      // =====================================================================
      // 12. ИНТЕРАКТИВ: НАЖАТИЕ НА КОЛОДУ (RAYCASTER)
      // =====================================================================
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function handlePointerDown(clientX, clientY) {
        if (appState !== 'IDLE') return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(deckGroup.children, false);
        if (hits.length > 0) {
          runTarotReading();
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        handlePointerDown(e.clientX, e.clientY);
      });

      // Курсор-указатель при наведении на колоду (для десктопа)
      canvas.addEventListener('pointermove', (e) => {
        if (appState !== 'IDLE') {
          canvas.style.cursor = 'default';
          return;
        }
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(deckGroup.children, false);
        canvas.style.cursor = hits.length > 0 ? 'pointer' : 'default';
      });

      // =====================================================================
      // 13. ГЛАВНЫЙ ЦИКЛ РЕНДЕРА (60 FPS + МЕРЦАНИЕ СВЕЧЕЙ)
      // =====================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        // Живое мерцание свечей слева и справа
        leftCandleLight.intensity = 4.2 + Math.sin(elapsed * 6.4) * 0.28 + Math.sin(elapsed * 14.3) * 0.14;
        rightCandleLight.intensity = 3.5 + Math.cos(elapsed * 5.7) * 0.24 + Math.sin(elapsed * 12.1) * 0.12;

        // Лёгкое «дыхание» верхней части колоды в режиме ожидания
        if (appState === 'IDLE') {
          deckGroup.position.y = Math.sin(elapsed * 1.9) * 0.008;
        } else {
          deckGroup.position.y = THREE.MathUtils.lerp(deckGroup.position.y, 0, 0.15);
        }

        updateMagicParticles(elapsed, dt);
        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
