<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Таро — 3D Расклад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #090204;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #ebd3b8;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #090204;
    }

    /* Фон: Фон.png */
    #bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: #0b0205;
      background-image:
        radial-gradient(ellipse at 50% 24%, rgba(88, 14, 26, 0.22) 0%, rgba(9, 2, 4, 0.72) 78%),
        url('Фон.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Живое мягкое свечение от свечей по бокам */
    #candle-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 4% 55%, rgba(255, 168, 86, 0.14) 0%, transparent 30%),
        radial-gradient(circle at 96% 63%, rgba(255, 154, 72, 0.13) 0%, transparent 26%);
      animation: candlePulse 3.2s ease-in-out infinite alternate;
    }

    @keyframes candlePulse {
      0%   { opacity: 0.72; }
      35%  { opacity: 0.96; }
      68%  { opacity: 0.80; }
      100% { opacity: 1.00; }
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    /* Минималистичный UI: только подсказка касания колоды и кнопка «Новый расклад» */
    #ui-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    }

    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #hint-pill {
      padding: 9px 20px;
      border-radius: 999px;
      background: rgba(18, 4, 8, 0.72);
      border: 1px solid rgba(212, 165, 120, 0.35);
      color: #efd7b8;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      animation: hintFloat 2.8s ease-in-out infinite;
    }

    #hint-pill.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    @keyframes hintFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    #reset-btn {
      pointer-events: none;
      cursor: pointer;
      padding: 11px 28px;
      border-radius: 999px;
      border: 1px solid rgba(224, 178, 126, 0.55);
      background: linear-gradient(180deg, rgba(78, 12, 24, 0.88) 0%, rgba(36, 5, 11, 0.94) 100%);
      color: #f5dfc4;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 220, 180, 0.22);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.45s ease, transform 0.45s ease, filter 0.2s ease;
    }

    #reset-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #reset-btn:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="bg-layer"></div>
    <div id="candle-glow"></div>
    <canvas id="webgl-canvas"></canvas>

    <div id="ui-layer">
      <div class="bottom-controls">
        <div id="hint-pill">Коснитесь колоды, чтобы перетасовать</div>
        <button id="reset-btn" type="button">Новый расклад</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // =====================================================================
      // 1. TELEGRAM MINI APP (FULLSCREEN)
      // =====================================================================
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
          if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
          if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#090204');
          if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#090204');
        } catch (e) {
          console.warn('Telegram WebApp init warning:', e);
        }
      }

      function haptic(type = 'light') {
        try {
          if (tg && tg.HapticFeedback) {
            if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
            else tg.HapticFeedback.impactOccurred(type);
          }
        } catch (_) {}
      }

      // =====================================================================
      // 2. ПОЛНЫЙ СПИСОК 78 КАРТ ТАРО (ЧИСТЫЕ НАЗВАНИЯ БЕЗ НОМЕРОВ АРКАНОВ)
      // =====================================================================
      const TAROT_CARDS = [
        // Старшие арканы (22)
        'Дурак',
        'Маг',
        'Жрица',
        'Императрица',
        'Император',
        'Жрец',
        'Влюбленные',
        'Колесница',
        'Сила',
        'Отшельник',
        'Колесо фортуны',
        'Справедливость',
        'Повешенный',
        'Смерть',
        'Умеренность',
        'Дьявол',
        'Башня',
        'Звезда',
        'Луна',
        'Солнце',
        'Страшный суд',
        'Мир',
        // Мечи (14)
        'Туз мечей', 'Двойка мечей', 'Тройка мечей', 'Четверка мечей',
        'Пятерка мечей', 'Шестерка мечей', 'Семерка мечей', 'Восьмерка мечей',
        'Девятка мечей', 'Десятка мечей', 'Король мечей', 'Рыцарь мечей',
        'Паж мечей', 'Королева мечей',
        // Кубки (14)
        'Туз кубков', 'Двойка кубков', 'Тройка кубков', 'Четверка кубков',
        'Пятерка кубков', 'Шестерка кубков', 'Семерка кубков', 'Восьмерка кубков',
        'Девятка кубков', 'Десятка кубков', 'Король кубков', 'Рыцарь кубков',
        'Паж кубков', 'Королева кубков',
        // Жезлы (14)
        'Туз жезлов', 'Двойка жезлов', 'Тройка жезлов', 'Четверка жезлов',
        'Пятерка жезлов', 'Шестерка жезлов', 'Семерка жезлов', 'Восьмерка жезлов',
        'Девятка жезлов', 'Десятка жезлов', 'Король жезлов', 'Рыцарь жезлов',
        'Паж жезлов', 'Королева жезлов',
        // Пентакли (14)
        'Туз пентаклей', 'Двойка пентаклей', 'Тройка пентаклей', 'Четверка пентаклей',
        'Пятерка пентаклей', 'Шестерка пентаклей', 'Семерка пентаклей', 'Восьмерка пентаклей',
        'Девятка пентаклей', 'Десятка пентаклей', 'Король пентаклей', 'Рыцарь пентаклей',
        'Паж пентаклей', 'Королева пентаклей'
      ];

      const CARD_BACK_FILE = 'Обратная сторона.png';

      // =====================================================================
      // 3. THREE.JS СЦЕНА, КАМЕРА И МЯГКОЕ МАТОВОЕ ОСВЕЩЕНИЕ БЕЗ БЛИКОВ
      // =====================================================================
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 60);

      function updateCameraForViewport() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const aspect = w / h;
        camera.aspect = aspect;

        if (aspect < 0.72) {
          camera.fov = 34;
          camera.position.set(0, 2.08, 7.55);
          camera.lookAt(0, 1.44, 0.0);
        } else {
          camera.fov = 34;
          camera.position.set(0, 2.25, 7.65);
          camera.lookAt(0, 1.32, 0.0);
        }
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      updateCameraForViewport();
      window.addEventListener('resize', updateCameraForViewport);

      // Равномерный мягкий свет (без пересветов и зеркальных бликов на картах)
      const baseAmbientIntensity = 1.18;
      const ambientLight = new THREE.AmbientLight(0x52212c, baseAmbientIntensity);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0x883546, 0x1b050a, 0.85);
      scene.add(hemiLight);

      const leftCandleLight = new THREE.PointLight(0xffa458, 3.8, 15, 1.45);
      leftCandleLight.position.set(-2.95, 1.78, -0.45);
      leftCandleLight.castShadow = true;
      leftCandleLight.shadow.mapSize.set(1024, 1024);
      leftCandleLight.shadow.bias = -0.0005;
      scene.add(leftCandleLight);

      const rightCandleLight = new THREE.PointLight(0xff984a, 3.2, 14, 1.5);
      rightCandleLight.position.set(3.05, 1.32, -0.25);
      scene.add(rightCandleLight);

      const moonRimLight = new THREE.DirectionalLight(0xe4c6aa, 0.52);
      moonRimLight.position.set(-0.4, 5.2, -2.4);
      moonRimLight.castShadow = true;
      moonRimLight.shadow.mapSize.set(1024, 1024);
      moonRimLight.shadow.camera.near = 1;
      moonRimLight.shadow.camera.far = 14;
      moonRimLight.shadow.camera.left = -3.2;
      moonRimLight.shadow.camera.right = 3.2;
      moonRimLight.shadow.camera.top = 3.2;
      moonRimLight.shadow.camera.bottom = -3.2;
      moonRimLight.shadow.bias = -0.0006;
      scene.add(moonRimLight);

      // Очень деликатная фронтальная подсветка для читаемости матовых карт при показе
      const revealFillLight = new THREE.DirectionalLight(0xfff4e6, 0.0);
      revealFillLight.position.set(0, 2.2, 8.2);
      scene.add(revealFillLight);

      // =====================================================================
      // 4. ПРОЦЕДУРНАЯ ТЕКСТУРА БАРХАТНОЙ СКАТЕРТИ (ОСВЕТЛЁННЫЕ КРАЯ)
      // =====================================================================
      function createVelvetTableTextures() {
        const size = 1024;
        const diffCanvas = document.createElement('canvas');
        diffCanvas.width = size;
        diffCanvas.height = size;
        const ctx = diffCanvas.getContext('2d');

        const bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bctx = bumpCanvas.getContext('2d');

        const cx = size / 2;
        const cy = size / 2;

        // Осветлённый к краям бордовый бархат (без провала в чёрный)
        const baseGrad = ctx.createRadialGradient(cx, cy * 0.96, size * 0.05, cx, cy, size * 0.52);
        baseGrad.addColorStop(0.0, '#6a0e1d');
        baseGrad.addColorStop(0.48, '#530b17');
        baseGrad.addColorStop(0.80, '#3c0711');
        baseGrad.addColorStop(1.0, '#2b050c');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(0, 0, size, size);

        bctx.fillStyle = '#707070';
        bctx.fillRect(0, 0, size, size);

        // Текстура мятого бархата
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = 18 + Math.random() * 72;
          const bright = Math.random() > 0.42;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, bright ? 'rgba(148, 24, 42, 0.09)' : 'rgba(16, 2, 5, 0.09)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          const bg = bctx.createRadialGradient(x, y, 0, x, y, r);
          bg.addColorStop(0, bright ? 'rgba(220,220,220,0.08)' : 'rgba(40,40,40,0.08)');
          bg.addColorStop(1, 'rgba(128,128,128,0)');
          bctx.fillStyle = bg;
          bctx.beginPath();
          bctx.arc(x, y, r, 0, Math.PI * 2);
          bctx.fill();
        }

        for (let i = 0; i < 8000; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          ctx.fillStyle = Math.random() > 0.48 ? 'rgba(175, 52, 66, 0.055)' : 'rgba(0, 0, 0, 0.07)';
          ctx.fillRect(x, y, 2, 2);
        }

        function drawStar(targetCtx, x, y, outerR, innerR, points, fill) {
          targetCtx.save();
          targetCtx.translate(x, y);
          targetCtx.beginPath();
          for (let i = 0; i < points * 2; i++) {
            const r = i % 2 === 0 ? outerR : innerR;
            const a = (i * Math.PI) / points - Math.PI / 2;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) targetCtx.moveTo(px, py);
            else targetCtx.lineTo(px, py);
          }
          targetCtx.closePath();
          targetCtx.fillStyle = fill;
          targetCtx.fill();
          targetCtx.restore();
        }

        function drawCrescent(targetCtx, x, y, radius, angle, color) {
          targetCtx.save();
          targetCtx.translate(x, y);
          targetCtx.rotate(angle);
          targetCtx.fillStyle = color;
          targetCtx.beginPath();
          targetCtx.arc(0, 0, radius, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.fillStyle = '#420813';
          targetCtx.beginPath();
          targetCtx.arc(radius * 0.36, 0, radius * 0.84, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.restore();
        }

        const goldMain = 'rgba(212, 160, 126, 0.82)';
        const goldSoft = 'rgba(202, 148, 114, 0.56)';
        const goldBright = 'rgba(232, 184, 146, 0.90)';

        ctx.strokeStyle = goldSoft;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.435, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.422, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = goldMain;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.145, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.132, 0, Math.PI * 2);
        ctx.stroke();

        const rayCount = 48;
        for (let i = 0; i < rayCount; i++) {
          const a = (i / rayCount) * Math.PI * 2;
          const isMajor = i % 4 === 0;
          const isMid = i % 2 === 0;
          const rStart = size * 0.148;
          const rEnd = size * (isMajor ? 0.255 : isMid ? 0.222 : 0.192);
          const halfW = isMajor ? 0.022 : 0.012;

          ctx.fillStyle = isMajor ? goldBright : goldSoft;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a - halfW) * rStart, cy + Math.sin(a - halfW) * rStart);
          ctx.lineTo(cx + Math.cos(a) * rEnd, cy + Math.sin(a) * rEnd);
          ctx.lineTo(cx + Math.cos(a + halfW) * rStart, cy + Math.sin(a + halfW) * rStart);
          ctx.closePath();
          ctx.fill();
        }

        drawStar(ctx, cx, cy, size * 0.118, size * 0.024, 4, goldBright);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.PI / 4);
        drawStar(ctx, 0, 0, size * 0.072, size * 0.016, 4, goldMain);
        ctx.restore();
        drawStar(bctx, cx, cy, size * 0.118, size * 0.024, 4, '#d8d8d8');

        drawCrescent(ctx, cx - size * 0.34, cy, size * 0.036, 0.0, goldMain);
        drawCrescent(ctx, cx + size * 0.34, cy, size * 0.036, Math.PI, goldMain);

        [
          [0, -0.33, 0.034], [0, 0.33, 0.034],
          [-0.26, -0.22, 0.022], [0.26, -0.22, 0.022],
          [-0.26, 0.23, 0.024], [0.26, 0.23, 0.024],
          [-0.14, 0.31, 0.014], [0.14, 0.31, 0.014],
          [-0.14, -0.31, 0.014], [0.14, -0.31, 0.014]
        ].forEach(([ox, oy, sr]) => {
          drawStar(ctx, cx + ox * size, cy + oy * size, sr * size, sr * size * 0.24, 4, goldMain);
        });

        // Очень лёгкое смягчение самого края (вместо сильного затемнения)
        const edgeFade = ctx.createRadialGradient(cx, cy, size * 0.36, cx, cy, size * 0.5);
        edgeFade.addColorStop(0, 'rgba(0,0,0,0)');
        edgeFade.addColorStop(1, 'rgba(18, 3, 6, 0.18)');
        ctx.fillStyle = edgeFade;
        ctx.fillRect(0, 0, size, size);

        const diffuseTex = new THREE.CanvasTexture(diffCanvas);
        diffuseTex.colorSpace = THREE.SRGBColorSpace;
        diffuseTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const bumpTex = new THREE.CanvasTexture(bumpCanvas);
        return { diffuseTex, bumpTex };
      }

      // =====================================================================
      // 5. 3D-СТОЛ
      // =====================================================================
      const TABLE_Y = 0.0;
      const TABLE_RADIUS = 2.42;
      const TABLE_Z_OFFSET = -0.32;
      const { diffuseTex, bumpTex } = createVelvetTableTextures();

      const tableGroup = new THREE.Group();
      tableGroup.position.set(0, TABLE_Y, TABLE_Z_OFFSET);
      scene.add(tableGroup);

      const tableTopGeo = new THREE.CylinderGeometry(TABLE_RADIUS, TABLE_RADIUS * 1.01, 0.12, 72, 1, false);
      const tableTopMat = new THREE.MeshStandardMaterial({
        map: diffuseTex,
        bumpMap: bumpTex,
        bumpScale: 0.024,
        roughness: 0.88,
        metalness: 0.04
      });
      const tableTopMesh = new THREE.Mesh(tableTopGeo, tableTopMat);
      tableTopMesh.position.y = -0.06;
      tableTopMesh.receiveShadow = true;
      tableGroup.add(tableTopMesh);

      const skirtGeo = new THREE.CylinderGeometry(TABLE_RADIUS * 1.005, TABLE_RADIUS * 1.12, 2.1, 96, 12, true);
      const posAttr = skirtGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = posAttr.getZ(i);
        const angle = Math.atan2(z, x);
        const depthFactor = THREE.MathUtils.clamp((1.05 - y) / 2.1, 0, 1);
        const fold =
          Math.sin(angle * 18) * 0.055 +
          Math.sin(angle * 31 + 1.1) * 0.026 +
          Math.cos(angle * 9) * 0.032;
        const r = Math.hypot(x, z) + fold * depthFactor;
        posAttr.setX(i, Math.cos(angle) * r);
        posAttr.setZ(i, Math.sin(angle) * r);
      }
      skirtGeo.computeVertexNormals();

      const skirtMat = new THREE.MeshStandardMaterial({
        color: 0x480914,
        bumpMap: bumpTex,
        bumpScale: 0.032,
        roughness: 0.90,
        metalness: 0.02
      });
      const skirtMesh = new THREE.Mesh(skirtGeo, skirtMat);
      skirtMesh.position.y = -1.11;
      skirtMesh.receiveShadow = true;
      tableGroup.add(skirtMesh);

      // =====================================================================
      // 6. УМНАЯ ЗАГРУЗКА ВСЕХ 78 ЛИЦЕВЫХ PNG + РУБАШКИ (МАТОВЫЕ МАТЕРИАЛЫ)
      // =====================================================================
      const texLoader = new THREE.TextureLoader();

      function createFallbackBackTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 864;
        const g = c.getContext('2d');
        const grad = g.createLinearGradient(0, 0, 512, 864);
        grad.addColorStop(0, '#1e050b');
        grad.addColorStop(0.5, '#3b0914');
        grad.addColorStop(1, '#180308');
        g.fillStyle = grad;
        g.fillRect(0, 0, 512, 864);
        g.strokeStyle = '#d3a372';
        g.lineWidth = 8;
        g.strokeRect(24, 24, 464, 816);
        g.lineWidth = 2.5;
        g.strokeRect(38, 38, 436, 788);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      function createFallbackFaceTexture(cardName) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 864;
        const g = c.getContext('2d');
        const bg = g.createLinearGradient(0, 0, 0, 864);
        bg.addColorStop(0, '#240d15');
        bg.addColorStop(0.5, '#33121c');
        bg.addColorStop(1, '#18080d');
        g.fillStyle = bg;
        g.fillRect(0, 0, 512, 864);
        g.strokeStyle = '#d9ae7e';
        g.lineWidth = 9;
        g.strokeRect(22, 22, 468, 820);
        g.fillStyle = '#f3dcc0';
        g.font = '600 36px Georgia, serif';
        g.textAlign = 'center';
        g.fillText(cardName, 256, 440);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      // Полностью матовая рубашка (без бликов)
      const backMaterial = new THREE.MeshStandardMaterial({
        map: createFallbackBackTexture(),
        roughness: 0.92,
        metalness: 0.0
      });

      texLoader.load(
        encodeURI(CARD_BACK_FILE),
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          backMaterial.map = tex;
          backMaterial.needsUpdate = true;
        },
        undefined,
        () => {}
      );

      // Генерируем возможные варианты имени файла (на случай е/ё или разного регистра)
      function buildFilenameCandidates(cardName) {
        const list = [];
        const add = (n) => {
          const url = encodeURI(n + '.png');
          if (!list.includes(url)) list.push(url);
        };

        add(cardName);

        // Вариант с ё (Влюблённые, Четвёрка, Пятёрка, Шестёрка, Семёрка, Восьмёрка)
        const yoMap = {
          'Влюбленные': 'Влюблённые',
          'Четверка': 'Четвёрка',
          'Пятерка': 'Пятёрка',
          'Шестерка': 'Шестёрка',
          'Семерка': 'Семёрка',
          'Восьмерка': 'Восьмёрка'
        };
        let withYo = cardName;
        for (const [k, v] of Object.entries(yoMap)) {
          if (withYo.includes(k)) withYo = withYo.replace(k, v);
        }
        if (withYo !== cardName) add(withYo);

        // Вариант со строчной буквы
        add(cardName.toLowerCase());
        if (withYo !== cardName) add(withYo.toLowerCase());

        // Вариант с заглавными словами (например «Колесо Фортуны», «Страшный Суд»)
        const titleCase = cardName.replace(/(^|\s)\S/g, (s) => s.toUpperCase());
        if (titleCase !== cardName) add(titleCase);

        return list;
      }

      function loadCardTextureIntoMaterial(cardObj) {
        if (cardObj.texturePromise) return cardObj.texturePromise;

        cardObj.texturePromise = new Promise((resolve) => {
          const candidates = buildFilenameCandidates(cardObj.name);

          function tryIdx(i) {
            if (i >= candidates.length) {
              console.warn('Не найден PNG для карты:', cardObj.name);
              const fb = createFallbackFaceTexture(cardObj.name);
              cardObj.faceMaterial.map = fb;
              cardObj.faceMaterial.needsUpdate = true;
              cardObj.textureLoaded = true;
              resolve(fb);
              return;
            }
            texLoader.load(
              candidates[i],
              (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                cardObj.faceMaterial.map = tex;
                cardObj.faceMaterial.needsUpdate = true;
                cardObj.textureLoaded = true;
                resolve(tex);
              },
              undefined,
              () => tryIdx(i + 1)
            );
          }
          tryIdx(0);
        });

        return cardObj.texturePromise;
      }

      // =====================================================================
      // 7. 78 ОБЪЁМНЫХ 3D-КАРТ С ЗАКРУГЛЁННЫМИ УГОЛКАМИ И РЕАЛЬНОЙ ВЫСОТОЙ КОЛОДЫ
      // =====================================================================
      const CARD_W = 0.50;
      const CARD_H = 0.86;
      const CARD_CORNER_RADIUS = 0.044; // Аккуратные закруглённые уголки карт Таро
      const CARD_THICKNESS = 0.0058;    // Высота колоды из 78 карт ≈ 0.48 (в ~2 раза компактнее, «полтора из трёх»)
      const CARD_STEP = CARD_THICKNESS * 1.05;
      const DECK_HOME = new THREE.Vector3(0, TABLE_Y, -1.18);

      // Генератор 3D-геометрии карты с закруглёнными уголками и физически правильными UV:
      // - Верхняя грань (+Y = рубашка): верх картинки на -Z, право на +X
      // - Нижняя грань (-Y = лицо): верх картинки на -Z, право на -X (при перевороте вокруг вертикали встаёт идеально ровно!)
      function createRoundedCardGeometry(width, thickness, height, radius, segX, segZ) {
        const geo = new THREE.BoxGeometry(width, thickness, height, segX, 1, segZ);
        const pos = geo.attributes.position;
        const uv = geo.attributes.uv;
        const hw = width * 0.5;
        const hh = height * 0.5;
        const r = Math.min(radius, hw * 0.45, hh * 0.45);
        const iw = hw - r;
        const ih = hh - r;

        // 1. Закругляем 4 уголка в плоскости XZ (гладкое отображение квадрата угла в четверть круга)
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let z = pos.getZ(i);
          const ax = Math.abs(x);
          const az = Math.abs(z);

          if (ax > iw && az > ih) {
            const dx = ax - iw;
            const dz = az - ih;
            const len = Math.hypot(dx, dz);
            if (len > 1e-6) {
              const scale = Math.max(dx, dz) / len;
              x = Math.sign(x) * (iw + dx * scale);
              z = Math.sign(z) * (ih + dz * scale);
              pos.setX(i, x);
              pos.setZ(i, z);
            }
          }
        }

        // 2. Пересчитываем чистые UV для верхней (+Y, group 2) и нижней (-Y, group 3) граней
        //    чтобы изображение карты не искажалось на закруглённых углах и не переворачивалось
        const index = geo.index;
        const topGroup = geo.groups[2];    // +Y (рубашка)
        const bottomGroup = geo.groups[3]; // -Y (лицевая сторона)

        const topVerts = new Set();
        for (let i = topGroup.start; i < topGroup.start + topGroup.count; i++) {
          topVerts.add(index ? index.getX(i) : i);
        }
        topVerts.forEach((vi) => {
          const x = pos.getX(vi);
          const z = pos.getZ(vi);
          const u = (x + hw) / width;         // -hw -> 0 (лево), +hw -> 1 (право)
          const v = 1.0 - (z + hh) / height;  // -hh -> 1 (верх), +hh -> 0 (низ)
          uv.setXY(vi, u, v);
        });

        const bottomVerts = new Set();
        for (let i = bottomGroup.start; i < bottomGroup.start + bottomGroup.count; i++) {
          bottomVerts.add(index ? index.getX(i) : i);
        }
        bottomVerts.forEach((vi) => {
          const x = pos.getX(vi);
          const z = pos.getZ(vi);
          const u = 1.0 - (x + hw) / width;   // +hw -> 0 (лево лица), -hw -> 1 (право лица)
          const v = 1.0 - (z + hh) / height;  // -hh -> 1 (верх лица), +hh -> 0 (низ лица)
          uv.setXY(vi, u, v);
        });

        pos.needsUpdate = true;
        uv.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
      }

      // Подразделённая скруглённая сетка для плавного 3D-изгиба
      const baseCardGeo = createRoundedCardGeometry(CARD_W, CARD_THICKNESS, CARD_H, CARD_CORNER_RADIUS, 10, 14);
      const basePosArray = new Float32Array(baseCardGeo.attributes.position.array);

      // Матовый золотисто-бумажный торец
      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: 0xc9a578,
        roughness: 0.86,
        metalness: 0.04
      });

      const cards = [];
      const deckGroup = new THREE.Group();
      scene.add(deckGroup);

      let deckOrder = [];

      for (let i = 0; i < TAROT_CARDS.length; i++) {
        const geo = baseCardGeo.clone();

        // Индивидуальный полностью МАТОВЫЙ материал лицевой стороны для каждой из 78 карт
        const faceMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.94,
          metalness: 0.0
        });

        const materials = [
          edgeMaterial,
          edgeMaterial,
          backMaterial,
          faceMaterial,
          edgeMaterial,
          edgeMaterial
        ];

        const mesh = new THREE.Mesh(geo, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const cardObj = {
          id: i,
          name: TAROT_CARDS[i],
          mesh,
          geo,
          faceMaterial,
          textureLoaded: false,
          texturePromise: null,
          bendX: 0,
          bendZ: 0,
          jitterX: (Math.random() - 0.5) * 0.007,
          jitterZ: (Math.random() - 0.5) * 0.007,
          jitterYRot: (Math.random() - 0.5) * 0.02
        };

        cards.push(cardObj);
        deckOrder.push(i);
        deckGroup.add(mesh);
      }

      function setCardBend(cardObj, bendX, bendZ) {
        if (Math.abs(cardObj.bendX - bendX) < 0.0004 && Math.abs(cardObj.bendZ - bendZ) < 0.0004) {
          return;
        }
        cardObj.bendX = bendX;
        cardObj.bendZ = bendZ;

        const pos = cardObj.geo.attributes.position;
        const arr = pos.array;
        const halfW = CARD_W * 0.5;
        const halfH = CARD_H * 0.5;

        for (let i = 0; i < arr.length; i += 3) {
          const ox = basePosArray[i];
          const oy = basePosArray[i + 1];
          const oz = basePosArray[i + 2];
          const nx = ox / halfW;
          const nz = oz / halfH;
          const dy = bendZ * (nz * nz - 0.33) + bendX * (nx * nx - 0.33);
          arr[i] = ox;
          arr[i + 1] = oy + dy;
          arr[i + 2] = oz;
        }
        pos.needsUpdate = true;
        cardObj.geo.computeVertexNormals();
      }

      function flattenAllCards() {
        for (let i = 0; i < cards.length; i++) {
          if (cards[i].bendX !== 0 || cards[i].bendZ !== 0) {
            setCardBend(cards[i], 0, 0);
          }
        }
      }

      // Предзагрузка всех 78 лицевых PNG-картинок сразу при старте
      (async function preloadAll78Textures() {
        const batchSize = 8;
        for (let i = 0; i < cards.length; i += batchSize) {
          const slice = cards.slice(i, i + batchSize);
          await Promise.all(slice.map((c) => loadCardTextureIntoMaterial(c)));
        }
      })();

      function fisherYatesShuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      fisherYatesShuffle(deckOrder);

      function placeDeckAtHomeInstant() {
        flattenAllCards();
        for (let idx = 0; idx < deckOrder.length; idx++) {
          const c = cards[deckOrder[idx]];
          const y = TABLE_Y + CARD_THICKNESS * 0.5 + idx * CARD_STEP;
          c.mesh.position.set(DECK_HOME.x + c.jitterX, y, DECK_HOME.z + c.jitterZ);
          c.mesh.rotation.set(0, c.jitterYRot, 0);
        }
      }
      placeDeckAtHomeInstant();

      // =====================================================================
      // 8. МАГИЧЕСКОЕ СВЕЧЕНИЕ, ДЫМОК И ИСКРЫ У КОЛОДЫ
      // =====================================================================
      function createSoftGlowSprite(innerColor, outerColor) {
        const c = document.createElement('canvas');
        c.width = 128;
        c.height = 128;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(64, 64, 2, 64, 64, 62);
        grad.addColorStop(0, innerColor);
        grad.addColorStop(0.45, outerColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const deckAura = new THREE.Mesh(
        new THREE.PlaneGeometry(1.45, 1.85),
        new THREE.MeshBasicMaterial({
          map: createSoftGlowSprite('rgba(255, 198, 132, 0.56)', 'rgba(175, 42, 62, 0.20)'),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          opacity: 0.70
        })
      );
      deckAura.rotation.x = -Math.PI / 2;
      deckAura.position.set(DECK_HOME.x, TABLE_Y + 0.006, DECK_HOME.z);
      scene.add(deckAura);

      const SMOKE_COUNT = 22;
      const smokeGeo = new THREE.BufferGeometry();
      const smokePositions = new Float32Array(SMOKE_COUNT * 3);
      const smokeData = Array.from({ length: SMOKE_COUNT }, () => ({
        angle: Math.random() * Math.PI * 2,
        radius: 0.1 + Math.random() * 0.36,
        speed: 0.22 + Math.random() * 0.24,
        phase: Math.random()
      }));
      smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
      const smokeMat = new THREE.PointsMaterial({
        map: createSoftGlowSprite('rgba(228, 165, 132, 0.22)', 'rgba(130, 32, 52, 0.09)'),
        size: 0.85,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.50
      });
      scene.add(new THREE.Points(smokeGeo, smokeMat));

      const SPARK_COUNT = 46;
      const sparkGeo = new THREE.BufferGeometry();
      const sparkPositions = new Float32Array(SPARK_COUNT * 3);
      const sparkData = Array.from({ length: SPARK_COUNT }, () => ({
        angle: Math.random() * Math.PI * 2,
        radius: 0.15 + Math.random() * 0.56,
        speed: 0.30 + Math.random() * 0.48,
        phase: Math.random(),
        swirl: (Math.random() - 0.5) * 1.4
      }));
      sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
      const sparkMat = new THREE.PointsMaterial({
        map: createSoftGlowSprite('rgba(255, 228, 172, 0.95)', 'rgba(235, 146, 74, 0.35)'),
        size: 0.11,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.82
      });
      scene.add(new THREE.Points(sparkGeo, sparkMat));

      let magicEffectsIntensity = 1.0;

      function updateMagicParticles(time, dt) {
        deckAura.material.opacity = (0.60 + Math.sin(time * 2.2) * 0.16) * magicEffectsIntensity;
        const sc = 1.0 + Math.sin(time * 1.7) * 0.05;
        deckAura.scale.set(sc, sc, 1);

        smokeMat.opacity = 0.46 * magicEffectsIntensity;
        sparkMat.opacity = 0.82 * magicEffectsIntensity;

        const sp = smokeGeo.attributes.position.array;
        for (let i = 0; i < SMOKE_COUNT; i++) {
          const d = smokeData[i];
          d.phase = (d.phase + dt * d.speed * 0.34) % 1;
          const y = TABLE_Y + 0.10 + d.phase * 1.35;
          const r = d.radius + d.phase * 0.25;
          const a = d.angle + time * 0.25 + d.phase * 1.2;
          sp[i * 3] = DECK_HOME.x + Math.cos(a) * r;
          sp[i * 3 + 1] = y;
          sp[i * 3 + 2] = DECK_HOME.z + Math.sin(a) * r * 0.85;
        }
        smokeGeo.attributes.position.needsUpdate = true;

        const kp = sparkGeo.attributes.position.array;
        for (let i = 0; i < SPARK_COUNT; i++) {
          const d = sparkData[i];
          d.phase = (d.phase + dt * d.speed * 0.40) % 1;
          const y = TABLE_Y + 0.08 + d.phase * 1.55;
          const r = d.radius * (0.85 + d.phase * 0.4);
          const a = d.angle + time * d.swirl;
          kp[i * 3] = DECK_HOME.x + Math.cos(a) * r;
          kp[i * 3 + 1] = y;
          kp[i * 3 + 2] = DECK_HOME.z + Math.sin(a) * r;
        }
        sparkGeo.attributes.position.needsUpdate = true;
      }

      // =====================================================================
      // 9. УТИЛИТЫ АНИМАЦИИ
      // =====================================================================
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;

      const waitMs = (ms) => new Promise((r) => setTimeout(r, ms));

      function animateDuration(durationMs, onUpdate) {
        return new Promise((resolve) => {
          const start = performance.now();
          function step(now) {
            const raw = Math.min((now - start) / durationMs, 1);
            onUpdate(raw);
            if (raw < 1) requestAnimationFrame(step);
            else resolve();
          }
          requestAnimationFrame(step);
        });
      }

      function computeStackTransform(centerPos, quat, index, totalCount) {
        const normal = new THREE.Vector3(0, 1, 0).applyQuaternion(quat);
        const offset = (index - (totalCount - 1) * 0.5) * CARD_STEP;
        return centerPos.clone().addScaledVector(normal, offset);
      }

      async function animMoveDeckTo(centerPos, euler, duration = 400) {
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const targetQuat = new THREE.Quaternion().setFromEuler(euler);
        const total = deckOrder.length;

        await animateDuration(duration, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < total; i++) {
            const c = cards[deckOrder[i]];
            const dst = computeStackTransform(centerPos, targetQuat, i, total);
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, targetQuat, t);
          }
        });
      }

      // =====================================================================
      // 10. 6 РЕАЛИСТИЧНЫХ 3D-ТАСОВОК (БЕЗ ПРОВАЛИВАНИЯ КАРТ)
      // =====================================================================

      // 1. Поворот колоды на ~90° на ребро + быстрый сброс карт по одной вниз
      async function shuffleVertical90Drop() {
        const topHand = new THREE.Vector3(0.44, 1.52, -0.35);
        const botHand = new THREE.Vector3(-0.32, 1.00, -0.30);

        const eulerTop = new THREE.Euler(0.18, 0.14, 1.38);
        const eulerBot = new THREE.Euler(0.14, -0.10, 1.18);
        const qBot = new THREE.Quaternion().setFromEuler(eulerBot);

        await animMoveDeckTo(topHand, eulerTop, 390);
        haptic('light');

        let remaining = [...deckOrder];
        let caught = [];
        const total = deckOrder.length;
        const pattern = [1, 1, 1, 1, 1, 1, 2, 1, 1, 1, 3, 1, 1, 1, 1, 4, 1, 1, 1, 5, 1, 1, 6, 8];

        for (const stepCount of pattern) {
          if (remaining.length <= 18) break;
          const chunk = remaining.splice(remaining.length - stepCount, stepCount);
          const starts = chunk.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));
          const baseIdx = caught.length;
          caught.push(...chunk);

          const dur = stepCount === 1 ? 62 : 100;
          await animateDuration(dur, (raw) => {
            const t = easeOutCubic(raw);
            for (let k = 0; k < chunk.length; k++) {
              const c = cards[chunk[k]];
              const dst = computeStackTransform(botHand, qBot, baseIdx + k, total);
              c.mesh.position.lerpVectors(starts[k].pos, dst, t);
              const arc = Math.sin(t * Math.PI);
              c.mesh.position.z += arc * 0.18;
              c.mesh.position.y += arc * 0.08;
              c.mesh.quaternion.slerpQuaternions(starts[k].quat, qBot, t);
              c.mesh.rotateX(arc * 0.22);
            }
          });
        }

        if (remaining.length > 0) {
          haptic('medium');
          const restSet = new Set(remaining);
          deckOrder = [...remaining, ...caught];
          const allStarts = deckOrder.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));
          const centerPos = new THREE.Vector3(0, 1.22, -0.32);
          const qEnd = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.18, 0, 0.06));

          await animateDuration(370, (raw) => {
            const t = easeInOutCubic(raw);
            for (let i = 0; i < deckOrder.length; i++) {
              const id = deckOrder[i];
              const c = cards[id];
              const dst = computeStackTransform(centerPos, qEnd, i, deckOrder.length);
              c.mesh.position.lerpVectors(allStarts[i].pos, dst, t);
              if (restSet.has(id)) {
                const arc = Math.sin(t * Math.PI);
                c.mesh.position.x += arc * 0.30;
                c.mesh.position.z -= arc * 0.40;
                c.mesh.position.y -= arc * 0.15;
              }
              c.mesh.quaternion.slerpQuaternions(allStarts[i].quat, qEnd, t);
            }
          });
        }
      }

      // 2. Упругая «Гармошка» с плавным 3D-изгибом каждой карты
      async function shuffleSmoothSpring() {
        const leftHand = new THREE.Vector3(-0.76, 1.40, -0.30);
        const rightHand = new THREE.Vector3(0.76, 1.20, -0.30);
        const eLeft = new THREE.Euler(0.22, 0.26, -0.44);
        const eRight = new THREE.Euler(0.18, -0.22, 0.34);
        const qRight = new THREE.Quaternion().setFromEuler(eRight);

        await animMoveDeckTo(leftHand, eLeft, 360);
        haptic('medium');

        await animateDuration(170, (raw) => {
          const bend = easeOutCubic(raw) * 0.095;
          for (let i = 0; i < deckOrder.length; i++) {
            setCardBend(cards[deckOrder[i]], 0, bend);
          }
        });

        const total = deckOrder.length;
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));

        await animateDuration(1150, (raw) => {
          for (let i = 0; i < total; i++) {
            const c = cards[deckOrder[i]];
            const delay = (i / total) * 0.60;
            const localT = THREE.MathUtils.clamp((raw - delay) / 0.40, 0, 1);
            const t = easeInOutSine(localT);

            const dst = computeStackTransform(rightHand, qRight, i, total);
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);

            const arc = Math.sin(localT * Math.PI);
            c.mesh.position.y += arc * 0.46;
            c.mesh.position.z += arc * 0.16;

            c.mesh.quaternion.slerpQuaternions(starts[i].quat, qRight, t);
            if (localT > 0 && localT < 1) {
              const flyBend = (1 - localT) * 0.095 + arc * 0.065;
              setCardBend(c, -arc * 0.04, flyBend);
              c.mesh.rotateZ(-arc * 0.36);
            } else if (localT >= 1) {
              setCardBend(c, 0, 0);
            }
          }
        });

        flattenAllCards();
        await animMoveDeckTo(new THREE.Vector3(0, 1.22, -0.32), new THREE.Euler(0.18, 0, 0), 330);
      }

      // 3. Настольный Риффл с плавным прогибом краёв и выравниванием
      async function shuffleTableRiffleBridge() {
        const half = Math.floor(deckOrder.length / 2);
        const leftHalf = deckOrder.slice(0, half);
        const rightHalf = deckOrder.slice(half);

        const leftPos = new THREE.Vector3(-0.46, TABLE_Y, -0.36);
        const rightPos = new THREE.Vector3(0.46, TABLE_Y, -0.36);
        const qLeft = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0.10, 0));
        const qRight = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -0.10, 0));

        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));

        await animateDuration(410, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const isLeft = i < half;
            const localIdx = isLeft ? i : i - half;
            const base = isLeft ? leftPos : rightPos;
            const dst = new THREE.Vector3(base.x, TABLE_Y + CARD_THICKNESS * 0.5 + localIdx * CARD_STEP, base.z);
            const c = cards[deckOrder[i]];
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.22;
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, isLeft ? qLeft : qRight, t);
          }
        });

        await animateDuration(190, (raw) => {
          const b = easeOutCubic(raw) * 0.08;
          for (let i = 0; i < leftHalf.length; i++) setCardBend(cards[leftHalf[i]], b, 0);
          for (let i = 0; i < rightHalf.length; i++) setCardBend(cards[rightHalf[i]], b, 0);
        });

        haptic('medium');

        const interleaved = [];
        let li = 0, ri = 0;
        while (li < leftHalf.length || ri < rightHalf.length) {
          const takeLeft = li < leftHalf.length && (ri >= rightHalf.length || Math.random() < 0.5);
          if (takeLeft) interleaved.push({ id: leftHalf[li++], side: -1 });
          else interleaved.push({ id: rightHalf[ri++], side: 1 });
        }

        const riffleStarts = interleaved.map((item) => ({
          pos: cards[item.id].mesh.position.clone(),
          quat: cards[item.id].mesh.quaternion.clone()
        }));

        await animateDuration(820, (raw) => {
          for (let i = 0; i < interleaved.length; i++) {
            const item = interleaved[i];
            const c = cards[item.id];
            const delay = (i / interleaved.length) * 0.64;
            const localT = THREE.MathUtils.clamp((raw - delay) / 0.36, 0, 1);
            const t = easeOutCubic(localT);

            const targetX = item.side * 0.14;
            const targetY = TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_STEP;
            const targetZ = -0.36;

            const arc = Math.sin(localT * Math.PI);
            c.mesh.position.set(
              THREE.MathUtils.lerp(riffleStarts[i].pos.x, targetX, t),
              THREE.MathUtils.lerp(riffleStarts[i].pos.y, targetY, t) + arc * 0.15,
              THREE.MathUtils.lerp(riffleStarts[i].pos.z, targetZ, t)
            );
            c.mesh.rotation.set(0, item.side * -0.04 * (1 - t), -item.side * arc * 0.24);
            setCardBend(c, (1 - t) * 0.08 + arc * 0.04, 0);
          }
        });

        deckOrder = interleaved.map((it) => it.id);

        const sqStarts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const qFlat = new THREE.Quaternion();
        haptic('light');

        await animateDuration(310, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const c = cards[deckOrder[i]];
            const dst = new THREE.Vector3(c.jitterX, TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_STEP, -0.36 + c.jitterZ);
            c.mesh.position.lerpVectors(sqStarts[i].pos, dst, t);
            c.mesh.quaternion.slerpQuaternions(sqStarts[i].quat, qFlat, t);
            setCardBend(c, 0, 0);
          }
        });
      }

      // 4. Вытягивание пачек из середины (18-28 карт) наверх и под низ
      async function shuffleCenterPacketPulls() {
        const center = new THREE.Vector3(0, 1.22, -0.32);
        const holdEuler = new THREE.Euler(0.22, 0.06, 0.03);
        const holdQuat = new THREE.Quaternion().setFromEuler(holdEuler);

        await animMoveDeckTo(center, holdEuler, 350);

        const moves = [
          { toTop: true, sideSign: 1 },
          { toTop: false, sideSign: -1 }
        ];

        for (const move of moves) {
          const packetSize = 18 + Math.floor(Math.random() * 11);
          const startIdx = Math.floor((deckOrder.length - packetSize) / 2);
          const bottomPart = deckOrder.slice(0, startIdx);
          const middlePart = deckOrder.slice(startIdx, startIdx + packetSize);
          const topPart = deckOrder.slice(startIdx + packetSize);
          const midSet = new Set(middlePart);

          const midStarts = middlePart.map((id) => cards[id].mesh.position.clone());
          haptic('light');

          await animateDuration(230, (raw) => {
            const t = easeOutCubic(raw);
            for (let k = 0; k < middlePart.length; k++) {
              const c = cards[middlePart[k]];
              c.mesh.position.copy(midStarts[k]);
              c.mesh.position.x += move.sideSign * 0.72 * t;
            }
          });

          deckOrder = move.toTop
            ? [...bottomPart, ...topPart, ...middlePart]
            : [...middlePart, ...bottomPart, ...topPart];

          const phase2Starts = deckOrder.map((id) => cards[id].mesh.position.clone());

          await animateDuration(350, (raw) => {
            const t = easeInOutCubic(raw);
            for (let i = 0; i < deckOrder.length; i++) {
              const id = deckOrder[i];
              const c = cards[id];
              const dst = computeStackTransform(center, holdQuat, i, deckOrder.length);
              c.mesh.position.lerpVectors(phase2Starts[i], dst, t);
              if (midSet.has(id)) {
                const arc = Math.sin(t * Math.PI);
                c.mesh.position.x += move.sideSign * 0.24 * arc;
                c.mesh.position.y += (move.toTop ? 0.30 : -0.30) * arc;
              }
              c.mesh.quaternion.copy(holdQuat);
            }
          });
        }
      }

      // 5. Индусская тасовка (Hindu Shuffle)
      async function shuffleHindu() {
        const backHand = new THREE.Vector3(0, 1.35, -0.78);
        const frontHand = new THREE.Vector3(0, 1.06, 0.14);
        const eBack = new THREE.Euler(0.14, 0.05, 0);
        const eFront = new THREE.Euler(0.06, -0.04, 0);
        const qFront = new THREE.Quaternion().setFromEuler(eFront);

        await animMoveDeckTo(backHand, eBack, 360);
        haptic('light');

        let remaining = [...deckOrder];
        let frontPile = [];
        const total = deckOrder.length;

        while (remaining.length > 0) {
          const take = remaining.length <= 12 ? remaining.length : 8 + Math.floor(Math.random() * 8);
          const chunk = remaining.splice(remaining.length - take, take);
          const starts = chunk.map((id) => ({
            pos: cards[id].mesh.position.clone(),
            quat: cards[id].mesh.quaternion.clone()
          }));
          const baseIdx = frontPile.length;
          frontPile.push(...chunk);

          haptic('light');
          await animateDuration(165, (raw) => {
            const t = easeOutCubic(raw);
            for (let k = 0; k < chunk.length; k++) {
              const c = cards[chunk[k]];
              const dst = computeStackTransform(frontHand, qFront, baseIdx + k, total);
              c.mesh.position.lerpVectors(starts[k].pos, dst, t);
              c.mesh.position.y += Math.sin(t * Math.PI) * 0.15;
              c.mesh.quaternion.slerpQuaternions(starts[k].quat, qFront, t);
            }
          });
        }

        deckOrder = frontPile;
      }

      // 6. Тройной настольный срез
      async function shuffleThreePacketCut() {
        const p1 = 24 + Math.floor(Math.random() * 6);
        const p2 = 24 + Math.floor(Math.random() * 6);
        const bot = deckOrder.slice(0, p1);
        const mid = deckOrder.slice(p1, p1 + p2);
        const top = deckOrder.slice(p1 + p2);

        const slots = [
          new THREE.Vector3(-0.72, TABLE_Y, -0.45),
          new THREE.Vector3(0.0,   TABLE_Y, -0.40),
          new THREE.Vector3(0.72,  TABLE_Y, -0.45)
        ];
        const piles = [bot, mid, top];
        const qFlat = new THREE.Quaternion();

        const starts1 = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));

        haptic('light');
        await animateDuration(410, (raw) => {
          const t = easeInOutCubic(raw);
          let globalIdx = 0;
          for (let p = 0; p < 3; p++) {
            const pile = piles[p];
            for (let k = 0; k < pile.length; k++) {
              const c = cards[pile[k]];
              const dst = new THREE.Vector3(slots[p].x, TABLE_Y + CARD_THICKNESS * 0.5 + k * CARD_STEP, slots[p].z);
              c.mesh.position.lerpVectors(starts1[globalIdx].pos, dst, t);
              c.mesh.position.y += Math.sin(t * Math.PI) * (0.16 + p * 0.07);
              c.mesh.quaternion.slerpQuaternions(starts1[globalIdx].quat, qFlat, t);
              globalIdx++;
            }
          }
        });

        await waitMs(100);

        const gatherOrder = [mid, top, bot];
        deckOrder = [...mid, ...top, ...bot];
        const centerSlot = new THREE.Vector3(0, TABLE_Y, -0.40);

        let currentHeight = mid.length;
        for (let g = 1; g < 3; g++) {
          const pile = gatherOrder[g];
          const pStarts = pile.map((id) => cards[id].mesh.position.clone());
          haptic('light');
          await animateDuration(280, (raw) => {
            const t = easeInOutCubic(raw);
            for (let k = 0; k < pile.length; k++) {
              const c = cards[pile[k]];
              const dst = new THREE.Vector3(
                centerSlot.x + c.jitterX,
                TABLE_Y + CARD_THICKNESS * 0.5 + (currentHeight + k) * CARD_STEP,
                centerSlot.z + c.jitterZ
              );
              c.mesh.position.lerpVectors(pStarts[k], dst, t);
              c.mesh.position.y += Math.sin(t * Math.PI) * 0.30;
            }
          });
          currentHeight += pile.length;
        }
      }

      async function animReturnDeckHome() {
        flattenAllCards();
        const starts = deckOrder.map((id) => ({
          pos: cards[id].mesh.position.clone(),
          quat: cards[id].mesh.quaternion.clone()
        }));
        const qFlat = new THREE.Quaternion();

        await animateDuration(460, (raw) => {
          const t = easeInOutCubic(raw);
          for (let i = 0; i < deckOrder.length; i++) {
            const c = cards[deckOrder[i]];
            const dst = new THREE.Vector3(
              DECK_HOME.x + c.jitterX,
              TABLE_Y + CARD_THICKNESS * 0.5 + i * CARD_STEP,
              DECK_HOME.z + c.jitterZ
            );
            c.mesh.position.lerpVectors(starts[i].pos, dst, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.20;
            const targetQ = qFlat.clone().setFromEuler(new THREE.Euler(0, c.jitterYRot, 0));
            c.mesh.quaternion.slerpQuaternions(starts[i].quat, targetQ, t);
          }
        });
      }

      // =====================================================================
      // 11. ВЫДАЧА 3 КАРТ, ПОДЪЁМ 90° (БЕЗ ОТРАЖЕНИЯ РУБАШКИ), ПЛАВНЫЙ РАЗВОРОТ
      // =====================================================================
      const SPREAD_SLOTS = [
        new THREE.Vector3(-0.57, TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.54),
        new THREE.Vector3(0.0,   TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.58),
        new THREE.Vector3(0.57,  TABLE_Y + CARD_THICKNESS * 0.5 + 0.004, 0.54)
      ];

      let drawnCards = [];
      let appState = 'IDLE';

      const hintPillEl = document.getElementById('hint-pill');
      const resetBtnEl = document.getElementById('reset-btn');

      async function runTarotReading() {
        if (appState !== 'IDLE') return;
        appState = 'SHUFFLING';
        haptic('medium');

        hintPillEl.classList.add('hidden');
        resetBtnEl.classList.remove('visible');

        animateDuration(380, (t) => { magicEffectsIntensity = 1.0 - 0.72 * t; });

        const allShuffles = [
          shuffleVertical90Drop,
          shuffleSmoothSpring,
          shuffleTableRiffleBridge,
          shuffleCenterPacketPulls,
          shuffleHindu,
          shuffleThreePacketCut
        ];
        const chosen = fisherYatesShuffle([...allShuffles]).slice(0, 3);

        for (const fn of chosen) {
          await fn();
        }

        await animReturnDeckHome();

        appState = 'DEALING';
        drawnCards = [
          cards[deckOrder.pop()],
          cards[deckOrder.pop()],
          cards[deckOrder.pop()]
        ];

        const faceLoadPromise = Promise.all(drawnCards.map((c) => loadCardTextureIntoMaterial(c)));

        // Выкладываем 3 карты на стол рубашкой вверх
        for (let i = 0; i < 3; i++) {
          const c = drawnCards[i];
          const startPos = c.mesh.position.clone();
          const startQuat = c.mesh.quaternion.clone();
          const endPos = SPREAD_SLOTS[i].clone();
          const endQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, (i - 1) * -0.025, 0));

          haptic('light');
          await animateDuration(380, (raw) => {
            const t = easeOutCubic(raw);
            c.mesh.position.lerpVectors(startPos, endPos, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.32;
            c.mesh.quaternion.slerpQuaternions(startQuat, endQuat, t);
          });
          await waitMs(80);
        }

        await faceLoadPromise;
        await waitMs(300);

        // ПОДЪЁМ НА 90° ПЕРЕД КАМЕРОЙ И ПЛАВНЫЙ РАЗВОРОТ ЛИЦОМ К ПОЛЬЗОВАТЕЛЮ
        appState = 'REVEALING';
        haptic('success');

        const camForward = new THREE.Vector3();
        camera.getWorldDirection(camForward);
        const camRight = new THREE.Vector3().crossVectors(camForward, camera.up).normalize();
        const camUp = new THREE.Vector3().crossVectors(camRight, camForward).normalize();

        const spacing = CARD_W + 0.085;
        const totalSpanW = 2 * spacing + CARD_W;
        const vFovRad = THREE.MathUtils.degToRad(camera.fov);
        const autoDist = totalSpanW / (0.86 * 2 * Math.tan(vFovRad / 2) * camera.aspect);
        const distFromCam = THREE.MathUtils.clamp(autoDist, 3.6, 7.2);

        const revealCenter = camera.position.clone()
          .addScaledVector(camForward, distFromCam)
          .addScaledVector(camUp, -0.02);

        // РУБАШКОЙ (+Y) К КАМЕРЕ (ТОЧНО БЕЗ ОТРАЖЕНИЯ И ПЕРЕВОРОТА):
        // +X -> +camRight (право рубашки справа)
        // +Y -> -camForward (рубашка смотрит на камеру)
        // +Z -> -camUp (-Z = верх рубашки смотрит ВВЕРХ)
        const backMatrix = new THREE.Matrix4().makeBasis(
          camRight.clone(),
          camForward.clone().negate(),
          camUp.clone().negate()
        );
        const revealBackQuat = new THREE.Quaternion().setFromRotationMatrix(backMatrix);

        // ЛИЦОМ (-Y) К КАМЕРЕ (поворот на 180° вокруг camUp):
        // +X -> -camRight, +Y -> +camForward (-Y на камеру), +Z -> -camUp (-Z = верх лица ВВЕРХ)
        const faceMatrix = new THREE.Matrix4().makeBasis(
          camRight.clone().negate(),
          camForward.clone(),
          camUp.clone().negate()
        );
        const revealFaceQuat = new THREE.Quaternion().setFromRotationMatrix(faceMatrix);

        const dealStarts = drawnCards.map((c) => ({
          pos: c.mesh.position.clone(),
          quat: c.mesh.quaternion.clone()
        }));
        const revealTargets = drawnCards.map((_, i) =>
          revealCenter.clone().addScaledVector(camRight, (i - 1) * spacing)
        );

        // 1. Поднимаем карты на 90° перед камерой (рубашкой к нам, в нормальной ориентации)
        await animateDuration(500, (raw) => {
          const t = easeOutCubic(raw);
          // Мягкое рассеянное усиление света без бликов
          ambientLight.intensity = baseAmbientIntensity + 0.35 * t;
          revealFillLight.intensity = 0.42 * t;
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            c.mesh.position.lerpVectors(dealStarts[i].pos, revealTargets[i], t);
            c.mesh.quaternion.slerpQuaternions(dealStarts[i].quat, revealBackQuat, t);
          }
        });

        // 2. Плавный 3D-разворот на 180° лицом к камере
        await animateDuration(760, (raw) => {
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            const localT = THREE.MathUtils.clamp((raw - i * 0.08) / 0.84, 0, 1);
            const eased = easeInOutCubic(localT);
            const spin = new THREE.Quaternion().setFromAxisAngle(camUp, Math.PI * eased);
            c.mesh.quaternion.copy(spin).multiply(revealBackQuat);
            c.mesh.position.copy(revealTargets[i]);
            c.mesh.position.addScaledVector(camForward, -Math.sin(eased * Math.PI) * 0.11);
          }
        });

        for (let i = 0; i < 3; i++) {
          drawnCards[i].mesh.quaternion.copy(revealFaceQuat);
          drawnCards[i].mesh.position.copy(revealTargets[i]);
        }

        // Показываем ровно 3 секунды
        await waitMs(3000);

        // 3. Аккуратно опускаем карты на стол ЛИЦОМ ВВЕРХ (поворот по Z на Math.PI кладёт -Y вверх, -Z к стене!)
        const downStarts = drawnCards.map((c) => ({
          pos: c.mesh.position.clone(),
          quat: c.mesh.quaternion.clone()
        }));

        await animateDuration(660, (raw) => {
          const t = easeInOutCubic(raw);
          ambientLight.intensity = baseAmbientIntensity + 0.35 * (1 - t);
          revealFillLight.intensity = 0.42 * (1 - t);
          for (let i = 0; i < 3; i++) {
            const c = drawnCards[i];
            const dstPos = SPREAD_SLOTS[i].clone();
            const dstQuat = new THREE.Quaternion().setFromEuler(
              new THREE.Euler(0, (i - 1) * -0.025, Math.PI)
            );
            c.mesh.position.lerpVectors(downStarts[i].pos, dstPos, t);
            c.mesh.position.y += Math.sin(t * Math.PI) * 0.22;
            c.mesh.quaternion.slerpQuaternions(downStarts[i].quat, dstQuat, t);
          }
        });

        animateDuration(550, (t) => { magicEffectsIntensity = 0.28 + 0.52 * t; });

        appState = 'DONE';
        resetBtnEl.classList.add('visible');

        window.LAST_TAROT_READING = drawnCards.map((c, idx) => ({
          position: idx + 1,
          card: c.name
        }));
      }

      async function resetReading() {
        if (appState !== 'DONE') return;
        appState = 'SHUFFLING';
        haptic('light');

        resetBtnEl.classList.remove('visible');

        deckOrder.push(...drawnCards.map((c) => c.id));
        drawnCards = [];

        await animReturnDeckHome();
        animateDuration(450, (t) => { magicEffectsIntensity = 0.8 + 0.2 * t; });

        appState = 'IDLE';
        hintPillEl.classList.remove('hidden');
      }

      resetBtnEl.addEventListener('click', resetReading);

      // =====================================================================
      // 12. ИНТЕРАКТИВ: НАЖАТИЕ НА КОЛОДУ
      // =====================================================================
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function handlePointerDown(clientX, clientY) {
        if (appState !== 'IDLE') return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(deckGroup.children, false);
        if (hits.length > 0) {
          runTarotReading();
        }
      }

      canvas.addEventListener('pointerdown', (e) => handlePointerDown(e.clientX, e.clientY));

      canvas.addEventListener('pointermove', (e) => {
        if (appState !== 'IDLE') {
          canvas.style.cursor = 'default';
          return;
        }
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(deckGroup.children, false);
        canvas.style.cursor = hits.length > 0 ? 'pointer' : 'default';
      });

      // =====================================================================
      // 13. ГЛАВНЫЙ ЦИКЛ РЕНДЕРА
      // =====================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        leftCandleLight.intensity = 3.7 + Math.sin(elapsed * 6.4) * 0.24 + Math.sin(elapsed * 14.3) * 0.10;
        rightCandleLight.intensity = 3.1 + Math.cos(elapsed * 5.7) * 0.20 + Math.sin(elapsed * 12.1) * 0.09;

        if (appState === 'IDLE') {
          deckGroup.position.y = Math.sin(elapsed * 1.9) * 0.005;
        } else {
          deckGroup.position.y = THREE.MathUtils.lerp(deckGroup.position.y, 0, 0.15);
        }

        updateMagicParticles(elapsed, dt);
        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
